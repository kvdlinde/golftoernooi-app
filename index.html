<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Golftoernooi</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gd: #1a3a2a; --gm: #2d5a3d; --gl: #4a8c5c; --gp: #c8e6c9;
  --cr: #f5f0e8; --cd: #ede5d0;
  --gold: #c9a84c; --goldl: #f0d878;
  --wh: #ffffff; --td: #1a1a1a; --tm: #4a4a4a; --tl: #6b7a6b;
  --red: #c0392b; --redl: #fadbd8;
  --blue: #1565c0; --bluel: #e3f2fd;
  --purple: #6a4c93; --purplel: #ede7f6;
  --sh: 0 4px 20px rgba(0,0,0,0.15); --shsm: 0 2px 8px rgba(0,0,0,0.08);
  --r: 6px; --rl: 12px;
  --hh: 56px; --nh: 62px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:'IBM Plex Sans','Inter',sans-serif;background:var(--cr);color:var(--td);padding-bottom:calc(var(--nh) + env(safe-area-inset-bottom))}

/* HEADER */
.hdr{background:var(--gd);position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:200;box-shadow:var(--sh);display:flex;align-items:center;justify-content:space-between;padding:0 16px;padding-top:env(safe-area-inset-top)}
.logo-t{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:900;color:var(--gold)}
.logo-s{font-family:'IBM Plex Mono',monospace;font-size:0.6rem;color:rgba(200,230,200,0.65);letter-spacing:.08em;text-transform:uppercase;display:block;margin-top:-1px}
.hdr-r{display:flex;gap:8px;align-items:center}
.adm-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:var(--cr);font-family:'IBM Plex Mono',monospace;font-size:.7rem;padding:7px 13px;border-radius:20px;cursor:pointer}
.adm-badge{background:var(--gold);color:var(--gd);font-family:'IBM Plex Mono',monospace;font-size:.65rem;padding:5px 11px;border-radius:20px;font-weight:700;border:none;cursor:pointer}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;height:var(--nh);padding-bottom:env(safe-area-inset-bottom);background:var(--gd);display:flex;z-index:200;box-shadow:0 -2px 20px rgba(0,0,0,.2)}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:rgba(200,230,200,.55);font-family:'IBM Plex Sans',sans-serif;font-size:.52rem;font-weight:500;cursor:pointer;padding:6px 2px;letter-spacing:.02em;transition:color .15s}
.ntab .ic{font-size:1.05rem;line-height:1}
.ntab.active{color:var(--gold)}
.ntab.active .ic{transform:translateY(-2px)}

/* MAIN */
.main{padding-top:calc(var(--hh) + 14px);padding-bottom:14px;min-height:100vh;max-width:640px;margin:0 auto}
.panel{display:none;padding:0 13px}
.panel.active{display:block}

/* SECTION */
.sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;padding-top:2px;gap:8px}
.st{font-family:'Playfair Display',serif;font-size:1.45rem;font-weight:700;color:var(--gd)}
.ss{font-size:.7rem;color:var(--tl);font-family:'Inter',sans-serif;font-weight:500}

/* CARD */
.card{background:var(--wh);border-radius:var(--rl);box-shadow:var(--shsm);margin-bottom:8px;overflow:hidden;border:1px solid rgba(0,0,0,.05)}
.ch{padding:13px 15px 10px;border-bottom:1px solid var(--cd);display:flex;align-items:center;justify-content:space-between;gap:8px}
.ct{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;color:var(--gd)}
.cb{padding:14px 15px}

/* STATS */
.srow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.srow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.sc{background:var(--wh);border-radius:var(--rl);padding:13px 15px;box-shadow:var(--shsm);border-left:4px solid var(--gl)}
.sv{font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:700;color:var(--gd);line-height:1}
.sl{font-family:'Inter',sans-serif;font-weight:500;font-size:.63rem;color:var(--tl);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* TABLE */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{background:var(--gd);color:var(--cr);padding:9px 9px;text-align:left;font-family:'Inter',sans-serif;font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;font-weight:600;white-space:nowrap}
td{padding:10px 9px;border-bottom:1px solid var(--cd);vertical-align:middle;font-size:14px;line-height:1.4}
tr:last-child td{border-bottom:none}

/* BADGES */
.rb{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:50%;font-family:'IBM Plex Mono',monospace;font-size:.68rem;font-weight:700;flex-shrink:0}
.r1{background:var(--gold);color:var(--gd)}.r2{background:#c0c0c0;color:#333}.r3{background:#cd7f32;color:#fff}.ro{background:var(--cd);color:var(--tm)}
.hb{display:inline-block;padding:3px 8px;border-radius:20px;font-family:'Inter',sans-serif;font-size:.75rem;font-weight:600;background:var(--gp);color:var(--gd)}
.sp{display:inline-block;padding:5px 11px;border-radius:20px;font-size:.78rem;font-family:'Inter',sans-serif;font-weight:600;white-space:nowrap}
.so{background:#e8f5e9;color:#2e7d32}.sc2{background:var(--cd);color:var(--tm)}.sa{background:var(--redl);color:var(--red)}.sg{background:#f0f0f0;color:#888}.sbdg{background:var(--bluel);color:var(--blue)}
.pb{display:inline-block;padding:3px 8px;border-radius:20px;font-family:'Inter',sans-serif;font-size:.75rem;font-weight:700;background:#fff9c4;color:#795548}
.teecirc{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:.62rem;font-weight:700;font-family:'IBM Plex Mono',monospace;border:1.5px solid rgba(0,0,0,.15);flex-shrink:0}

/* FORMS */
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.fg label{font-size:.68rem;font-weight:600;color:var(--tm);letter-spacing:.04em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace}
.fg input,.fg select,.fg textarea{padding:12px 13px;border:1.5px solid var(--cd);border-radius:var(--r);font-family:'IBM Plex Sans',sans-serif;font-size:.95rem;color:var(--td);background:var(--cr);width:100%;-webkit-appearance:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--gl);background:var(--wh)}
.fg .hint{font-size:.7rem;color:var(--tl);font-family:'Inter',sans-serif;font-weight:400;text-transform:none;letter-spacing:0}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* BUTTONS */
.btn{font-family:'IBM Plex Sans',sans-serif;font-size:.88rem;font-weight:600;padding:13px 20px;border-radius:var(--r);border:none;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;-webkit-appearance:none}
.btn:active{transform:scale(.97)}
.bp{background:var(--gm);color:#fff}.bg{background:var(--cd);color:var(--td)}.bd{background:var(--red);color:#fff}.bgo{background:var(--gold);color:var(--gd)}.bbl{background:var(--blue);color:#fff}.bpu{background:var(--purple);color:#fff}
.bf{width:100%}.bsm{padding:8px 13px;font-size:.76rem}
.brow{display:flex;gap:8px;flex-wrap:wrap}

/* TABS (sub-navigation within a panel, e.g. klassement netto/bruto) */
.subtabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.subtab{flex-shrink:0;background:var(--wh);border:1.5px solid var(--cd);color:var(--tm);font-family:'Inter',sans-serif;font-size:.75rem;font-weight:600;padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap}
.subtab.active{background:var(--gd);border-color:var(--gd);color:var(--gold)}

/* RONDE / TOERNOOI CARDS */
.rc{background:var(--wh);border-radius:var(--rl);box-shadow:var(--shsm);margin-bottom:6px;border:1px solid rgba(0,0,0,.05);overflow:hidden}
.rch{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;cursor:pointer;gap:8px}
.rd{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--gd)}
.rm{font-family:'Inter',sans-serif;font-size:.8rem;color:var(--tl);margin-top:3px}
.ra{display:flex;gap:8px;padding:10px 15px;border-top:1px solid var(--cd);background:var(--cr);flex-wrap:wrap}

/* SCORE ENTRY GRID */
.holerow{display:grid;grid-template-columns:22px 1fr 28px 44px 40px;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--cd)}
.holerow:last-child{border-bottom:none}
.holerow .hn{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--tl);text-align:center}
.holerow .hp{font-family:'Inter',sans-serif;font-size:.72rem;color:var(--tm)}
.holerow .hp b{color:var(--gd)}
.holerow .hstroke{display:flex;justify-content:center}
.hstroke .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.holerow input{width:44px;height:40px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:1rem;font-weight:700;border:2px solid var(--cd);border-radius:var(--r);background:var(--cr);padding:0;-webkit-appearance:none}
.holerow input:focus{outline:none;border-color:var(--gl);background:#fff}
.hpts{font-family:'Inter',sans-serif;font-size:.68rem;font-weight:700;text-align:center;padding:4px 2px;border-radius:20px;background:var(--cd);color:var(--tm)}
.pts-empty{background:transparent;color:var(--tl)}
.pts-blob{background:var(--redl);color:var(--red)}
.pts-1{background:#f0f0f0;color:#888}
.pts-2{background:var(--bluel);color:var(--blue)}
.pts-3{background:#e8f5e9;color:#2e7d32}
.pts-4p{background:#fff3e0;color:#e65100}
.ssumm{background:var(--cr);border:1px solid var(--cd);border-radius:var(--rl);padding:10px 6px;font-family:'Inter',sans-serif;display:flex;flex-direction:row;gap:0;margin:12px 0}
.si2{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;border-right:1px solid var(--cd);padding:4px 2px}.si2:last-child{border-right:none}
.sv2{font-size:1.1rem;font-weight:700;color:var(--gd);font-family:'Inter',sans-serif}
.sl2{font-size:.56rem;color:var(--tl);text-transform:uppercase;letter-spacing:.04em;font-family:'Inter',sans-serif;font-weight:600}

/* MODAL */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;align-items:flex-end;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.mo.open{display:flex}
.md{background:var(--wh);border-radius:var(--rl) var(--rl) 0 0;padding:20px;width:100%;max-width:520px;box-shadow:var(--sh);max-height:88vh;overflow-y:auto}
.md h3{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--gd);margin-bottom:14px}
.mh{width:36px;height:4px;background:var(--cd);border-radius:2px;margin:0 auto 14px}

/* SETUP */
.sbox{background:var(--gd);color:var(--cr);border-radius:var(--rl);padding:18px;margin-bottom:14px}
.sbox h3{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--gold);margin-bottom:10px}
.sbox p{font-size:.82rem;line-height:1.6;margin-bottom:6px}
.sbox code{background:rgba(255,255,255,.15);padding:1px 5px;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:.78rem}
.step{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px}
.snum{background:var(--gold);color:var(--gd);width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:.68rem;font-weight:700;flex-shrink:0;margin-top:2px}
.empty{text-align:center;padding:28px 16px;color:var(--tl);font-style:italic;font-size:.84rem}
pre.sqlbox{background:rgba(0,0,0,.25);border-radius:8px;padding:12px;font-family:'IBM Plex Mono',monospace;font-size:.68rem;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow-y:auto;margin:10px 0}

/* TOAST */
.tc{position:fixed;top:calc(var(--hh) + 8px);left:0;right:0;z-index:500;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{background:var(--gd);color:var(--wh);font-family:'Inter',sans-serif;font-size:.82rem;font-weight:500;padding:10px 18px;border-radius:20px;box-shadow:var(--sh);max-width:420px;text-align:center}
.toast.err{background:var(--red)}

.hide{display:none!important}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <span class="logo-t">⛳ Golftoernooi</span>
    <span class="logo-s" id="hdrSub">kleine toernooien, grote klassementen</span>
  </div>
  <div class="hdr-r" id="hdrR">
    <button class="adm-btn" id="btnAdminLogin" onclick="openAdminLoginModal()">Admin</button>
  </div>
</div>

<main class="main">

<!-- ============ SETUP (Supabase nog niet geconfigureerd) ============ -->
<div class="panel" id="panel-setup"></div>

<!-- ============ SPELER LOGIN / REGISTRATIE ============ -->
<div class="panel" id="panel-login"></div>

<!-- ============ SPELER: TOERNOOIEN ============ -->

<!-- ============ SPELER: KLASSEMENT ============ -->

<!-- ============ SPELER: PROFIEL ============ -->

<!-- ============ ADMIN: BANEN ============ -->
<div class="panel" id="panel-banen"></div>

<!-- ============ ADMIN: TOERNOOIBEHEER ============ -->
<div class="panel" id="panel-beheer-toernooien"></div>

<!-- ============ ADMIN: SPELERSBEHEER ============ -->

</main>

<div class="bnav" id="bnav"></div>

<!-- ============ MODALS ============ -->

<script>
/* =========================================================
   GOLFTOERNOOI APP — single-file HTML/CSS/JS, Supabase backend
   ========================================================= */

/* ---------- SUPABASE CREDENTIALS ----------
   Leeg bij oplevering. Vul in via de Setup-tab (test in de browser
   met localStorage), en hardcode daarna deze twee regels voor productie
   zodat elke deelnemer meteen verbinding heeft zonder eigen setup. */
let SBU = 'https://ylpqecktnvggfglrkldq.supabase.co';
let SBK = 'sb_publishable_8sV-EaUZ1rCNGbA-G13dSQ_L6IFWSBO';

/* ---------- GLOBALE STATE ---------- */
let ingelogdSpeler = null;   // {id, naam, email, exact_hcp, actief}
let ingelogdAdmin  = null;   // {id, naam}
let allBanen = [], allLussen = [], allCombinaties = [], allTees = [];
let allSpelers = [], allToernooien = [], allRondes = [], allDeelnemers = [];
const scoreCache = {}; // key: rondeId_spelerId -> array(18)

function isAdmin(){ return !!ingelogdAdmin; }
function isIngelogd(){ return !!ingelogdSpeler || !!ingelogdAdmin; }

/* ---------- HOLE ALLOCATIE (WHS-methode) ---------- */
// Hoeveel slagen krijgt/geeft een speler op een hole met gegeven stroke index (1-18),
// bij een playing handicap pH (positief = hoger dan scratch, negatief = plus-hcp).
function shots(pH, si){
  const abs = Math.abs(pH);
  const base = Math.floor(abs/18);
  const extra = abs%18;
  const s = base + (si<=extra?1:0);
  return pH<0 ? -s : s;
}
// Netto stableford-punten voor één hole.
function sfp(score, par, sh){
  if(score==null || isNaN(score)) return null;
  const n = score - par - sh;
  if(n>=2) return 0;
  if(n===1) return 1;
  if(n===0) return 2;
  if(n===-1) return 3;
  if(n===-2) return 4;
  return 5;
}

/* ---------- WHS HANDICAP FORMULES ---------- */
// Course Handicap = Exact HCP x (Slope/113) + (Course Rating - Par)
function courseHandicap(exactHcp, slope, courseRating, par){
  if(exactHcp==null || slope==null || courseRating==null || par==null) return null;
  const ch = parseFloat(exactHcp) * (slope/113) + (courseRating - par);
  return Math.round(ch);
}
// Playing Handicap = Course Handicap x toernooi-allowance% (default 100)
function playingHandicap(exactHcp, tee, allowancePct){
  if(!tee) return null;
  const ch = courseHandicap(exactHcp, tee.slope_rating, tee.course_rating, tee.par);
  if(ch==null) return null;
  const pct = (allowancePct==null?100:allowancePct)/100;
  return Math.round(ch*pct);
}

/* ---------- FORMATTERS ---------- */
function fH(h){ // format handicap: positief normaal, negatief als "+x"
  if(h==null||isNaN(h)) return '—';
  const n = parseFloat(h);
  return n<0 ? ('+'+Math.abs(n).toFixed(1).replace(/\.0$/,'')) : n.toFixed(1).replace(/\.0$/,'');
}
function fPH(h){
  if(h==null||isNaN(h)) return '—';
  return h<0 ? ('+'+Math.abs(h)) : String(h);
}
function fDatum(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'});
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- TOAST ---------- */
function toast(msg, isErr=false){
  const c = document.getElementById('tc');
  const t = document.createElement('div');
  t.className = 'toast'+(isErr?' err':'');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(()=>t.remove(), isErr?7000:3500);
}

/* ---------- MODAL HELPERS ---------- */
function openModalHtml(id, html){
  let el = document.getElementById(id);
  if(!el){
    el = document.createElement('div');
    el.className = 'mo';
    el.id = id;
    document.getElementById('modals').appendChild(el);
  }
  el.innerHTML = '<div class="md"><div class="mh"></div>'+html+'</div>';
  el.classList.add('open');
  el.onclick = (e)=>{ if(e.target===el) closeModal(id); };
}
function closeModal(id){
  const el = document.getElementById(id);
  if(el) el.classList.remove('open');
}

/* ---------- PBKDF2 HASHING (pincodes & wachtwoorden) ---------- */
function randomSalt(){
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashMet(pin, salt){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pin), {name:'PBKDF2'}, false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt: enc.encode(salt), iterations: 100000, hash:'SHA-256'}, keyMaterial, 256);
  return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function maakHash(pin){
  const salt = randomSalt();
  const hash = await hashMet(pin, salt);
  return salt+'$'+hash;
}
async function verifieerHash(pin, opgeslagen){
  if(!opgeslagen || !opgeslagen.includes('$')) return false;
  const [salt, hash] = opgeslagen.split('$');
  const test = await hashMet(pin, salt);
  return test===hash;
}
const ZWAKKE_PINS = new Set(['0000','1111','2222','3333','4444','5555','6666','7777','8888','9999','1234','2345','3456','4567','5678','6789','7890','4321','5432','6543','7654','8765','9876','0987','1212','2121','1010','0101']);
// Willekeurige 4-cijferige pincode (geen zwakke) — gebruikt bij het automatisch
// aanmaken van spelersaccounts tijdens een startlijst-import.
function genereerRandomPin(){
  let pin;
  do{
    const bytes = new Uint8Array(2);
    crypto.getRandomValues(bytes);
    pin = String(((bytes[0]<<8)|bytes[1])%10000).padStart(4,'0');
  } while(ZWAKKE_PINS.has(pin));
  return pin;
}

/* ---------- SUPABASE REST HELPERS ---------- */
async function sbFetch(path, opts={}){
  let r;
  try{
    // Ondersteunt zowel de oude (JWT) anon key als de nieuwe "Publishable key"
    // (sb_publishable_...). Die laatste is geen JWT en hoort volgens Supabase
    // alleen in de apikey-header te staan, niet in Authorization: Bearer.
    const isJwt = SBK.startsWith('eyJ');
    r = await fetch(SBU+'/rest/v1/'+path, {
      method: opts.method||'GET',
      headers: {'apikey':SBK, ...(isJwt?{'Authorization':'Bearer '+SBK}:{}), 'Content-Type':'application/json','Prefer':opts.prefer||'return=representation',...(opts.headers||{})},
      body: opts.body!=null ? JSON.stringify(opts.body) : undefined
    });
  }catch(networkErr){
    throw new Error('Netwerkfout ('+networkErr.message+'). Controleer je internetverbinding en of het Supabase-project actief is.');
  }
  if(!r.ok){
    let t=''; try{ t=await r.text(); }catch(_){}
    let msg=t;
    try{ const j=JSON.parse(t); msg=j.message||j.error||t; }catch(_){}
    throw new Error(msg||('HTTP '+r.status));
  }
  if(r.status===204) return null;
  const txt = await r.text();
  if(!txt) return null;
  try{ return JSON.parse(txt); }catch(_){ return null; }
}
const sbG  = (t,q='') => sbFetch(t+'?'+q);
const sbP  = (t,b)    => sbFetch(t, {method:'POST', body:b});
const sbPa = (t,id,b) => sbFetch(t+'?id=eq.'+id, {method:'PATCH', body:b, prefer:'return=representation'});

function validPwd(pwd){
  if(!pwd||pwd.length<8) return 'Wachtwoord moet minimaal 8 tekens zijn';
  if(!/[a-zA-Z]/.test(pwd)) return 'Wachtwoord moet minimaal één letter bevatten';
  if(!/[0-9]/.test(pwd)) return 'Wachtwoord moet minimaal één cijfer bevatten';
  return null;
}

async function boot(){
  document.querySelectorAll('.panel').forEach(p=>{ p.classList.remove('active'); p.innerHTML=''; });
  try{
    await laadAlles();
  }catch(e){
    toast('Kan Supabase niet bereiken: '+e.message, true);
  }
  // Sessie herstellen
  const spId = localStorage.getItem('speler_id');
  const adNaam = localStorage.getItem('admin_naam');
  if(spId){
    ingelogdSpeler = allSpelers.find(s=>s.id===spId) || null;
    if(!ingelogdSpeler) localStorage.removeItem('speler_id');
  }
  if(adNaam){
    // Admin-sessie: we bewaren alleen de naam lokaal; echte check gebeurt bij gevoelige acties niet opnieuw
    // (eenvoudige MVP-aanpak — zie opmerking bij setup over edge functions voor hardening)
    const rec = await sbG('admins','naam=eq.'+encodeURIComponent(adNaam)+'&select=id,naam').catch(()=>[]);
    if(rec && rec[0]) ingelogdAdmin = rec[0];
    else localStorage.removeItem('admin_naam');
  }
  renderHeader();
  renderNav();
  if(ingelogdSpeler || isAdmin()){
    const last = localStorage.getItem('laatstePanel');
    const tabs = navConfig().map(t=>t.p);
    showPanel(tabs.includes(last)?last:tabs[0]);
  } else {
    document.getElementById('panel-login').classList.add('active');
    renderLoginPanel();
  }
}

async function laadAlles(){
  const [banen, lussen, combinaties, tees, spelers] = await Promise.all([
    sbG('banen','order=naam'),

    sbG('combinaties','order=naam'),
    sbG('tees','order=kleur'),
    sbG('spelers','select=id,naam,email,exact_hcp,hcp_bevestigd,actief&order=naam')
  ]);
  allBanen = banen||[]; allLussen = lussen||[]; allCombinaties = combinaties||[]; allTees = tees||[]; allSpelers = spelers||[];
  const [toernooien, rondes, deelnemers] = await Promise.all([
    sbG('toernooien','order=created_at.desc'),
    sbG('toernooi_rondes','order=volgorde'),
    sbG('toernooi_deelnemers','')
  ]);
  allToernooien = toernooien||[]; allRondes = rondes||[]; allDeelnemers = deelnemers||[];
}

/* =========================================================
   BANEN / LUSSEN / COMBINATIES / TEES
   ========================================================= */
function lusById(id){ return allLussen.find(l=>l.id===id); }
function combinatieById(id){ return allCombinaties.find(c=>c.id===id); }
function baanById(id){ return allBanen.find(b=>b.id===id); }
function teeById(id){ return allTees.find(t=>t.id===id); }

// Geeft de 18 holes (par, si) van een combinatie terug, ongeacht of het 1 lus van
// 18 holes is of 2 lussen van 9 holes samengevoegd (lus1 = holes 1-9, lus2 = 10-18).
function combinatieHoles(comb){
  if(!comb) return null;
  const l1 = lusById(comb.lus1_id);
  if(!l1) return null;
  if(!comb.lus2_id) return l1.holes; // lus is zelf al 18 holes
  const l2 = lusById(comb.lus2_id);
  if(!l2) return null;
  return [...l1.holes, ...l2.holes];
}
function combinatieParTotaal(comb){
  const h = combinatieHoles(comb);
  return h ? h.reduce((a,x)=>a+(x.par||0),0) : null;
}
function combinatieLabel(comb){
  if(!comb) return '—';
  const baan = baanById(comb.baan_id);
  return (baan?baan.naam+' — ':'')+comb.naam;
}

// Vult de losse par/SI-velden in één keer vanuit geplakte tekst (één "par,si" per regel),
// zodat je een scorekaart niet hole voor hole hoeft over te typen.
function vulHolesVanuitTekst(){
  const raw = document.getElementById('lusSnelInvoer').value.trim();
  if(!raw){ toast('Plak eerst per hole een regel "par,si"', true); return; }
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const n = document.querySelectorAll('#lusHolesWrap .fr').length;
  if(lines.length !== n){
    toast('Je plakte '+lines.length+' regel(s), maar deze lus heeft '+n+' holes — pas "Aantal holes" aan of check je tekst', true);
    return;
  }
  for(let i=0;i<n;i++){
    const parts = lines[i].split(/[,;\t ]+/).map(s=>s.trim()).filter(Boolean);
    const par = parseInt(parts[0]), si = parseInt(parts[1]);
    if(isNaN(par)||isNaN(si)){ toast('Regel '+(i+1)+' ("'+lines[i]+'") snap ik niet — gebruik het formaat par,si', true); return; }
    document.getElementById('lh_par_'+i).value = par;
    document.getElementById('lh_si_'+i).value = si;
  }
  toast('Holes ingevuld — controleer de velden en sla op');
}
async function saveLus(baanId, id){
  const naam = document.getElementById('lusNaam').value.trim();
  if(!naam){ toast('Vul een naam in', true); return; }
  const n = id ? lusById(id).holes.length : parseInt(document.getElementById('lusAantal').value);
  const holes = [];
  for(let i=0;i<n;i++){
    const par = parseInt(document.getElementById('lh_par_'+i).value);
    const si = parseInt(document.getElementById('lh_si_'+i).value);
    if(isNaN(par)||isNaN(si)){ toast('Vul alle holes volledig in', true); return; }
    holes.push({par, si});
  }
  try{
    if(id) await sbPa('lussen', id, {naam, holes});
    else await sbP('lussen', {baan_id:baanId, naam, holes});
    closeModal('moLus'); toast('Lus opgeslagen');
    await laadAlles(); renderBanenPanel();
  }catch(e){ toast('Opslaan mislukt: '+e.message, true); }
}

// Voor een lus die zelf al 18 holes is (geen tweede negen nodig): de gebruiker hoeft
// niet te snappen wat een "combinatie" is — dit maakt 'm onzichtbaar aan voor je en
// opent meteen het tee-formulier.
function combinatieVoorLus(lusId){
  return allCombinaties.find(c=>c.lus1_id===lusId && !c.lus2_id) || null;
}
async function voegTeeToeAanLus(baanId, lusId){
  let comb = combinatieVoorLus(lusId);
  if(!comb){
    const lus = lusById(lusId);
    try{
      const rows = await sbP('combinaties', {baan_id: baanId, naam: lus.naam, lus1_id: lusId, lus2_id: null});
      await laadAlles();
      comb = rows && rows[0] ? rows[0] : combinatieVoorLus(lusId);
    }catch(e){ toast('Aanmaken mislukt: '+e.message, true); return; }
  }
  if(!comb){ toast('Kon geen combinatie vinden/aanmaken voor deze lus', true); return; }
  openTeeModal(comb.id);
}

  const lus2_id = document.getElementById('combLus2').value || null;

  try{
    if(id) await sbPa('combinaties', id, {naam, lus1_id, lus2_id});
    else await sbP('combinaties', {baan_id:baanId, naam, lus1_id, lus2_id});

    await laadAlles(); renderBanenPanel();

/* =========================================================
   SCOREBEREKENING (pure functie — hergebruikt bij invoer én herberekenen)
   ========================================================= */
// holeScores: array van 18 (int of null), holes: array van 18 {par,si}, pH: playing handicap
// Geeft {bruto,netto,stableford,birdies_netto,eagles_netto,birdies_bruto,eagles_bruto,compleet}
function berekenScore(holeScores, holes, pH){
  let bruto=0, sf=0, compleet=true;
  let bN=0, eN=0, bB=0, eB=0;
  for(let i=0;i<18;i++){
    const v = holeScores[i];
    const par = holes[i].par, si = holes[i].si;
    if(v==null || isNaN(v)){ compleet=false; continue; }
    const sh = shots(pH, si);
    const p = sfp(v, par, sh);
    bruto += v; sf += p;
    const netDiff = v - par - sh;   // netto t.o.v. par
    const brutoDiff = v - par;      // bruto t.o.v. par
    if(netDiff===-1) bN++; else if(netDiff<=-2) eN++;
    if(brutoDiff===-1) bB++; else if(brutoDiff<=-2) eB++;
  }
  const netto = compleet ? bruto - pH : null;
  return {bruto:compleet?bruto:null, netto, stableford:compleet?sf:null, birdies_netto:bN, eagles_netto:eN, birdies_bruto:bB, eagles_bruto:eB, compleet};
}

function resizeLogoBestand(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 400;
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>=h){ h = Math.round(h*maxDim/w); w = maxDim; } else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = ()=>reject(new Error('Kon afbeelding niet lezen'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('Kon bestand niet lezen'));
    reader.readAsDataURL(file);
  });
}
async function kiesToernooiLogo(input){
  const file = input.files && input.files[0];
  if(!file) return;
  try{
    const dataUrl = await resizeLogoBestand(file);
    if(dataUrl.length > 800000){ toast('Deze afbeelding is te groot/complex — kies een eenvoudiger logo', true); return; }
    window._tnLogoData = dataUrl;
    document.getElementById('tnLogoPreview').innerHTML = `<img src="${dataUrl}" style="max-height:70px;border-radius:8px;display:block;margin-bottom:6px"><a href="#" onclick="event.preventDefault();verwijderToernooiLogo()">Logo verwijderen</a>`;

}

function parseNaamRegel(regel){
  const m = regel.match(/^(.*)\(([^)]*)\)\s*$/);
  if(m) return {naam: m[1].trim(), notitie: m[2].trim()};
  return {naam: regel.trim(), notitie: null};
}
async function laadFlightsVoorRonde(rondeId){

    const flightIds = flights.map(f=>f.id);
    spelers = flightIds.length ? (await sbG('ronde_flight_spelers','flight_id=in.('+flightIds.join(',')+')&order=volgorde') || []) : [];

async function importeerStartlijst(){
  const ctx = window._stlCtx;
  const raw = document.getElementById('stlPlak').value.trim();
  if(!raw){ toast('Plak eerst een startlijst', true); return; }
  const ronde = rondeById(ctx.rondeId);
  const blocks = raw.split(/\n\s*\n/).map(b=>b.split('\n').map(l=>l.trim()).filter(Boolean)).filter(b=>b.length>1);
  if(!blocks.length){ toast('Kon geen flights herkennen — eerste regel is de tijd, daarna namen', true); return; }

  const nieuweSpelers = [];
  let gekoppeldeSpelers = 0;
  let volgordeFlight = ctx.flights.reduce((m,f)=>Math.max(m,f.volgorde),0) + 1;

  for(const block of blocks){
    const starttijd = block[0];
    const namen = block.slice(1);
    try{
      const flightRows = await sbP('ronde_flights', {ronde_id: ctx.rondeId, starttijd, volgorde: volgordeFlight});
      const flight = flightRows[0];
      volgordeFlight++;
      let volgordeSpeler = 1;
      for(const regel of namen){
        const {naam, notitie} = parseNaamRegel(regel);
        if(!naam) continue;
        let speler = allSpelers.find(s=>s.naam.toLowerCase()===naam.toLowerCase());
        if(!speler){
          const pin = genereerRandomPin();
          const hash = await maakHash(pin);
          const rows = await sbP('spelers', {naam, pin_hash:hash});
          speler = rows[0];
          allSpelers.push(speler);
          nieuweSpelers.push({naam, pin});
        } else {
          gekoppeldeSpelers++;
        }
        const bestaandeDeelname = allDeelnemers.find(d=>d.toernooi_id===ronde.toernooi_id && d.speler_id===speler.id);
        if(!bestaandeDeelname){
          const dRows = await sbP('toernooi_deelnemers', {toernooi_id: ronde.toernooi_id, speler_id: speler.id, status:'bevestigd'});
          allDeelnemers.push(dRows[0]);
        }
        await sbP('ronde_flight_spelers', {flight_id: flight.id, speler_id: speler.id, notitie, volgorde: volgordeSpeler});
        volgordeSpeler++;
      }
    }catch(e){ toast('Fout bij importeren: '+e.message, true); }
  }

  document.getElementById('stlPlak').value = '';
  await laadAlles();
  await renderStartlijstBody(ctx.rondeId);
  renderBeheerToernooienPanel();
  toast(blocks.length+' flight(s) verwerkt · '+gekoppeldeSpelers+' bestaande speler(s) gekoppeld · '+nieuweSpelers.length+' nieuwe account(s)');

  if(nieuweSpelers.length){
    openModalHtml('moNieuwePincodes', `<h3>${nieuweSpelers.length} nieuwe spelersaccounts</h3>
      <p style="font-size:.82rem;color:var(--tl);font-family:'Inter',sans-serif;margin-bottom:10px">Deel deze pincodes met de betreffende spelers zodat ze kunnen inloggen (ze kunnen 'm daarna zelf wijzigen via Profiel).</p>
      <div class="tw"><table><thead><tr><th>Naam</th><th>Pincode</th></tr></thead><tbody>
      ${nieuweSpelers.map(n=>`<tr><td>${esc(n.naam)}</td><td><b>${n.pin}</b></td></tr>`).join('')}
      </tbody></table></div>
      <button class="btn bp bf" style="margin-top:12px" onclick="closeModal('moNieuwePincodes')">Sluiten</button>`);
  }
}

async function laadScoresVoorToernooi(toernooiId){
  const rondeIds = allRondes.filter(r=>r.toernooi_id===toernooiId).map(r=>r.id);
  if(!rondeIds.length) return [];
  try{ return await sbG('scores','ronde_id=in.('+rondeIds.join(',')+')') || []; }
  catch(e){ toast('Kon scores niet laden: '+e.message, true); return []; }
}

function mijnToernooien(){
  // Admins zien alle toernooien (ook als ze zelf geen deelnemer zijn); spelers alleen waarvoor ze zijn uitgenodigd.
  if(isAdmin()) return allToernooien;
  if(!ingelogdSpeler) return [];
  const mijnIds = new Set(allDeelnemers.filter(d=>d.speler_id===ingelogdSpeler.id).map(d=>d.toernooi_id));
  return allToernooien.filter(t=>mijnIds.has(t.id));
}

function renderToernooienPanel(){
  const el = document.getElementById('panel-toernooien');
  const lijst = mijnToernooien();
  el.innerHTML = `
  <div class="sh"><div><div class="st">Toernooien</div><div class="ss">${lijst.length} toernooi(en)</div></div></div>
  ${lijst.length?lijst.map(t=>{
    const rondes = allRondes.filter(r=>r.toernooi_id===t.id);
    const gesloten = rondes.filter(r=>r.status==='gesloten').length;
    return `<div class="rc"><div class="rch" onclick="openToernooiDetail('${t.id}')" style="align-items:center">
      ${t.logo_data?`<img src="${t.logo_data}" style="width:40px;height:40px;border-radius:8px;object-fit:cover;margin-right:10px">`:''}
      <div><div class="rd">${esc(t.naam)}</div><div class="rm">${rondes.length} ronde(s) · ${gesloten} gesloten</div></div>
      <span style="color:var(--tl)">›</span>
    </div></div>`;
  }).join(''):'<div class="empty">Nog geen toernooien.</div>'}`;
}

async function openToernooiDetail(toernooiId){
  showPanel('toernooien'); // houd nav-status correct
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-toernooi-detail').classList.add('active');
  document.querySelectorAll('.ntab[data-panel="toernooien"]').forEach(t=>t.classList.add('active'));
  const t = toernooiById(toernooiId);
  const el = document.getElementById('panel-toernooi-detail');
  el.innerHTML = '<div class="empty">Laden…</div>';
  const scores = await laadScoresVoorToernooi(toernooiId);
  const rondes = allRondes.filter(r=>r.toernooi_id===toernooiId).sort((a,b)=>a.volgorde-b.volgorde);
  const mijnDeelname = ingelogdSpeler ? allDeelnemers.find(d=>d.toernooi_id===toernooiId && d.speler_id===ingelogdSpeler.id) : null;
  const {flights: alleFlights, spelers: alleFlightSpelers} = ingelogdSpeler ? await laadFlightsVoorToernooi(toernooiId) : {flights:[], spelers:[]};
  // Gebruikt dit toernooi de startlijst-functie (ergens een flight ingevoerd)?
  // Dan blijft een ronde voor spelers verborgen totdat de admin de startlijst voor
  // die specifieke ronde heeft ingevoerd — en daarna alleen zichtbaar voor wie erin staat
  // (handig als de helft van de groep op een andere baan speelt dezelfde dag).
  // Toernooien die geen startlijst gebruiken blijven gewoon al hun rondes tonen.
  const gebruiktStartlijst = alleFlights.length>0;
  const rondesTeTonen = (ingelogdSpeler && !isAdmin() && gebruiktStartlijst) ? rondes.filter(r=>{
    const rondeFlightIds = new Set(alleFlights.filter(f=>f.ronde_id===r.id).map(f=>f.id));
    if(!rondeFlightIds.size) return false; // startlijst voor deze ronde nog niet ingevoerd -> nog niet tonen
    return alleFlightSpelers.some(fs=>rondeFlightIds.has(fs.flight_id) && fs.speler_id===ingelogdSpeler.id);
  }) : rondes;
  el.innerHTML = `
  <button class="btn bg bsm" onclick="showPanel('toernooien')" style="margin-bottom:10px">‹ Terug</button>
  <div class="sh" style="align-items:center">
    ${t.logo_data?`<img src="${t.logo_data}" style="width:56px;height:56px;border-radius:10px;object-fit:cover;margin-right:12px">`:''}
    <div><div class="st">${esc(t.naam)}</div></div>
  </div>
  ${t.beschrijving?`<p style="font-size:.85rem;color:var(--tm);font-family:'Inter',sans-serif;margin-bottom:12px">${esc(t.beschrijving)}</p>`:''}
  ${mijnDeelname && mijnDeelname.status==='uitgenodigd' ? `
    <div class="card"><div class="cb" style="display:flex;gap:8px;align-items:center;justify-content:space-between">
      <span style="font-family:'Inter',sans-serif;font-size:.85rem">Je bent uitgenodigd voor dit toernooi.</span>
      <div class="brow"><button class="btn bp bsm" onclick="reageerDeelname('${mijnDeelname.id}','bevestigd')">Meedoen</button><button class="btn bg bsm" onclick="reageerDeelname('${mijnDeelname.id}','afgemeld')">Afmelden</button></div>
    </div></div>` : ''}
  ${rondesTeTonen.map(r=>{
    const comb = combinatieById(r.combinatie_id);
    const baan = comb ? baanById(comb.baan_id) : null;
    const mijnScore = ingelogdSpeler ? scores.find(s=>s.ronde_id===r.id && s.speler_id===ingelogdSpeler.id) : null;
    const aantalIngevoerd = scores.filter(s=>s.ronde_id===r.id && s.stableford!=null).length;
    let mijnFlightHtml = '';
    if(ingelogdSpeler){
      const rondeFlightIds = new Set(alleFlights.filter(f=>f.ronde_id===r.id).map(f=>f.id));
      const mijnFlightSpeler = alleFlightSpelers.find(fs=>rondeFlightIds.has(fs.flight_id) && fs.speler_id===ingelogdSpeler.id);
      if(mijnFlightSpeler){
        const flight = alleFlights.find(f=>f.id===mijnFlightSpeler.flight_id);
        const medespelers = alleFlightSpelers.filter(fs=>fs.flight_id===flight.id && fs.speler_id!==ingelogdSpeler.id)
          .map(fs=>{ const sp = allSpelers.find(s=>s.id===fs.speler_id); return sp?sp.naam:'?'; });
        mijnFlightHtml = `<div class="rm" style="margin-top:4px">🕐 Jouw starttijd:</div><div class="rm"><b>${esc(flight.starttijd||'—')}</b>${medespelers.length?' met '+esc(medespelers.join(', ')):''}</div>`;
      }
    }
    return `<div class="rc"><div class="rch">
      <div><div class="rd" style="font-size:1rem">${esc(baan?baan.naam:'—')}</div><div class="rm">${comb?esc(comb.naam):'—'}</div>${mijnFlightHtml}</div>
    </div>
    <div class="ra">
      ${r.status==='gesloten' ? `<span class="rm">${aantalIngevoerd} kaart(en) ingeleverd — uitslag hieronder bij Klassement</span>` :
        ingelogdSpeler ? `<button class="btn ${mijnScore&&mijnScore.stableford!=null?'bg':'bp'} bsm" onclick="openScoreModal('${r.id}')">${mijnScore&&mijnScore.stableford!=null?'Score bewerken':'Score invoeren'}</button>` : ''}
      ${isAdmin()?`<button class="btn bbl bsm" onclick="openInvoerstatusModal('${r.id}')">Score invoeren (admin)</button>`:''}
    </div>
    </div>`;
  }).join('') || `<div class="empty">${rondes.length?'Nog geen starttijd voor je bekend voor dit toernooi.':'Nog geen rondes gepland.'}</div>`}
  `;
}
async function reageerDeelname(deelnemerId, status){
  try{ await sbPa('toernooi_deelnemers', deelnemerId, {status}); toast(status==='bevestigd'?'Je doet mee!':'Je bent afgemeld'); await laadAlles(); showPanel('toernooien'); }
  catch(e){ toast('Mislukt: '+e.message, true); }
}
async function openInvoerstatusModal(rondeId){
  const ronde = rondeById(rondeId);
  const comb = combinatieById(ronde.combinatie_id);
  const baan = comb ? baanById(comb.baan_id) : null;
  const deeln = allDeelnemers.filter(d=>d.toernooi_id===ronde.toernooi_id && d.status!=='afgemeld');
  let scores = [];
  try{ scores = await sbG('scores','ronde_id=eq.'+rondeId) || []; }
  catch(e){ toast('Kon scores niet laden: '+e.message, true); }
  const rows = deeln.map(d=>{
    const sp = allSpelers.find(s=>s.id===d.speler_id);
    if(!sp) return null;
    const sc = scores.find(s=>s.speler_id===sp.id);
    const compleet = !!(sc && sc.stableford!=null);
    const aantal = sc && sc.hole_scores ? sc.hole_scores.filter(v=>v!=null).length : 0;
    return {sp, compleet, aantal};
  }).filter(Boolean).sort((a,b)=>a.sp.naam.localeCompare(b.sp.naam));
  const aantalCompleet = rows.filter(r=>r.compleet).length;
  openModalHtml('moInvoerstatus', `<h3>${esc(baan?baan.naam:ronde.naam)}${comb?' — '+esc(comb.naam):''}</h3>
    <p style="font-size:.8rem;color:var(--tm);font-family:'Inter',sans-serif;margin-bottom:10px">${aantalCompleet} van ${rows.length} kaart(en) compleet. Klik op een speler om de kaart te openen.</p>
    <div style="display:flex;flex-direction:column;gap:6px;max-height:58vh;overflow:auto">
      ${rows.map(r=>`<div onclick="closeModal('moInvoerstatus');openScoreModal('${rondeId}','${r.sp.id}')"
          style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;background:${r.compleet?'#e8f5e9':'var(--redl)'};font-family:'Inter',sans-serif;font-size:.88rem">
        <span>${esc(r.sp.naam)}</span>
        <span style="font-weight:600;color:${r.compleet?'#2e7d32':'var(--red)'}">${r.compleet?'✓ Compleet':(r.aantal>0?r.aantal+'/18':'Nog niets')}</span>
      </div>`).join('') || '<div class="empty">Geen deelnemers voor dit toernooi.</div>'}
    </div>`);
}

async function slaProfielOp(){
  const email = document.getElementById('prEmail').value.trim();
  const hcp = parseFloat(document.getElementById('prHcp').value);
  if(isNaN(hcp)){ toast('Vul een geldige handicap in', true); return; }
  try{
    await sbPa('spelers', ingelogdSpeler.id, {email:email||null, exact_hcp:hcp, hcp_bevestigd:true});
    ingelogdSpeler.email = email; ingelogdSpeler.exact_hcp = hcp; ingelogdSpeler.hcp_bevestigd = true;
    toast('Profiel opgeslagen'); await laadAlles();
  }catch(e){ toast('Opslaan mislukt: '+e.message, true); }
}
async function wijzigPincode(){
  const pin = document.getElementById('prPin').value.trim();
  if(!/^\d{4}$/.test(pin)){ toast('Pincode moet 4 cijfers zijn', true); return; }
  if(ZWAKKE_PINS.has(pin)){ toast('Kies een minder voor de hand liggende pincode', true); return; }
  try{
    const hash = await maakHash(pin);
    await sbPa('spelers', ingelogdSpeler.id, {pin_hash:hash});
    toast('Pincode bijgewerkt'); document.getElementById('prPin').value='';
  }catch(e){ toast('Mislukt: '+e.message, true); }
}

async function openScoreModal(rondeId, forceSpelerId){
  const ronde = rondeById(rondeId);
  const comb = combinatieById(ronde.combinatie_id);
  const holes = combinatieHoles(comb);
  if(!holes){ toast('Combinatie-data ontbreekt voor deze ronde', true); return; }
  const tees = allTees.filter(t=>t.combinatie_id===comb.id);
  const toernooi = toernooiById(ronde.toernooi_id);
  const readOnly = ronde.status==='gesloten' && !isAdmin();
  let spelerId = forceSpelerId || (isAdmin()?null:ingelogdSpeler.id);

  // Eerste keer dat deze speler zelf een kaart opent: eerst exacte hcp laten bevestigen
  // (spelers die via de startlijst-import zijn aangemaakt hebben nog nooit zelf hun hcp opgegeven).
  if(!isAdmin() && !readOnly && ingelogdSpeler && ingelogdSpeler.hcp_bevestigd!==true){
    window._scGateRondeId = rondeId;
    openModalHtml('moScore', `<h3>${esc(ronde.naam)} — ${combinatieLabel(comb)}</h3>
      <p style="font-size:.85rem;color:var(--tm);font-family:'Inter',sans-serif;margin-bottom:10px">Voordat je voor het eerst een score invoert, hebben we je exacte (WHS) handicap nodig.</p>
      <div class="fg"><label>Exacte handicap</label><input type="number" step="0.1" min="-10" max="54" id="scGateHcp" placeholder="bijv. 18.4"></div>
      <button class="btn bp bf" onclick="bevestigHcpEnGaVerder()">Doorgaan</button>`);
    return;
  }

  let spelerPickerHtml = '';
  if(isAdmin()){
    const deeln = allDeelnemers.filter(d=>d.toernooi_id===ronde.toernooi_id);
    spelerPickerHtml = `<div class="fg"><label>Speler</label><select id="scSpeler" onchange="openScoreModal('${rondeId}', this.value)">
      <option value="">— kies speler —</option>
      ${deeln.map(d=>{const sp=allSpelers.find(s=>s.id===d.speler_id); return sp?`<option value="${sp.id}" ${spelerId===sp.id?'selected':''}>${esc(sp.naam)}</option>`:'';}).join('')}
    </select></div>`;
  }
  window._scCtx = {rondeId, holes, tees, toernooi, readOnly, currentPH:null, existingScore:null};
  openModalHtml('moScore', `<h3>${esc(ronde.naam)} — ${combinatieLabel(comb)}</h3>
    ${readOnly?'<p style="font-size:.78rem;color:var(--tl);font-family:\'Inter\',sans-serif;margin-bottom:10px">Deze ronde is gesloten — alleen-lezen.</p>':''}
    ${spelerPickerHtml}
    <div id="scBody">${spelerId?'':'<p style="font-size:.85rem;color:var(--tl);font-family:\'Inter\',sans-serif">Kies eerst een speler.</p>'}</div>`);
  if(spelerId) await renderScoreBody(spelerId);
}
async function bevestigHcpEnGaVerder(){
  const hcp = parseFloat(document.getElementById('scGateHcp').value);
  if(isNaN(hcp)){ toast('Vul een geldige handicap in', true); return; }
  try{
    await sbPa('spelers', ingelogdSpeler.id, {exact_hcp:hcp, hcp_bevestigd:true});
    ingelogdSpeler.exact_hcp = hcp; ingelogdSpeler.hcp_bevestigd = true;
    const idx = allSpelers.findIndex(x=>x.id===ingelogdSpeler.id);
    if(idx>-1){ allSpelers[idx].exact_hcp = hcp; allSpelers[idx].hcp_bevestigd = true; }
    const rondeId = window._scGateRondeId;
    toast('Handicap opgeslagen');
    await openScoreModal(rondeId);
  }catch(e){ toast('Opslaan mislukt: '+e.message, true); }
}
async function renderScoreBody(spelerId){
  const ctx = window._scCtx;
  const speler = allSpelers.find(s=>s.id===spelerId);
  let existing = null;
  try{ const rows = await sbG('scores','ronde_id=eq.'+ctx.rondeId+'&speler_id=eq.'+spelerId); existing = rows&&rows[0]; }catch(e){}
  ctx.spelerId = spelerId; ctx.existingScore = existing;
  const teeId = existing ? existing.tee_id : (ctx.tees.length===1?ctx.tees[0].id:'');
  const body = document.getElementById('scBody');
  body.innerHTML = `
    <div class="fg"><label>Tee</label><select id="scTee" ${ctx.readOnly?'disabled':''} onchange="onTeeChange()">
      <option value="">— kies tee —</option>
      ${ctx.tees.map(t=>`<option value="${t.id}" ${teeId===t.id?'selected':''}>${esc(t.kleur)} (CR ${t.course_rating}/Slope ${t.slope_rating})</option>`).join('')}
    </select></div>
    <div id="scPHInfo" style="font-size:.8rem;color:var(--tl);font-family:'Inter',sans-serif;margin-bottom:10px">Kies een tee om je playing handicap te zien.</div>
    <div id="scNoTeeMsg" class="empty" style="${teeId?'display:none':''}">${ctx.readOnly?'Geen score ingevoerd voor deze ronde.':'Kies eerst een tee om te starten met scoren.'}</div>
    <div id="scEntryArea" style="${teeId?'':'display:none'}">
      <div id="scGrid">${holeGridHtml(ctx.holes, existing, ctx.readOnly)}</div>
      <div class="ssumm" id="scSumm">
        <div class="si2"><div class="sv2" id="scBruto">—</div><div class="sl2">Bruto</div></div>
        <div class="si2"><div class="sv2" id="scNetto">—</div><div class="sl2">Netto</div></div>
        <div class="si2"><div class="sv2" id="scStbl">—</div><div class="sl2">Stableford</div></div>
      </div>
      ${ctx.readOnly?'':'<button class="btn bp bf" style="margin-top:12px" onclick="slaScoreOp()">Score opslaan</button>'}
      ${(isAdmin() && ctx.existingScore)?'<button class="btn bd bf" style="margin-top:8px" onclick="resetScorekaart()">Kaart resetten</button>':''}
    </div>
  `;
  if(teeId){ document.getElementById('scTee').value = teeId; onTeeChange(); }
}
async function resetScorekaart(){
  const ctx = window._scCtx;
  if(!ctx.existingScore) return;
  const speler = allSpelers.find(s=>s.id===ctx.spelerId);
  if(!confirm(`Scorekaart van ${speler?speler.naam:'deze speler'} volledig wissen? Dit kan niet ongedaan gemaakt worden.`)) return;
  try{
    await sbD('scores', ctx.existingScore.id);
    toast('Scorekaart gereset');
    closeModal('moScore');
    if(document.getElementById('panel-toernooi-detail').classList.contains('active')) openToernooiDetail(rondeById(ctx.rondeId).toernooi_id);
    if(document.getElementById('panel-beheer-toernooien').classList.contains('active')) renderBeheerToernooienPanel();
  }catch(e){ toast('Resetten mislukt: '+e.message, true); }
}
function holeGridHtml(holes, existing, readOnly){
  const vals = existing && existing.hole_scores ? existing.hole_scores : new Array(18).fill(null);
  let rows='';
  for(let i=0;i<18;i++){
    const h = holes[i];
    const v = vals[i];
    rows += `<div class="holerow">
      <div class="hn">${i+1}</div>
      <div class="hp">par <b>${h.par}</b> · si ${h.si}</div>
      <div class="hstroke" id="hstroke${i}"></div>
      <input type="number" min="1" max="12" id="h${i}" value="${v!=null?v:''}" ${readOnly?'disabled':''} oninput="recalcScoreLive()">
      <div class="hpts pts-empty" id="pt${i}">—</div>
    </div>`;
  }
  return rows;
}
function onTeeChange(){
  const ctx = window._scCtx;
  const teeId = document.getElementById('scTee').value;
  const tee = teeId?teeById(teeId):null;
  const speler = allSpelers.find(s=>s.id===ctx.spelerId);
  ctx.currentPH = tee ? playingHandicap(speler.exact_hcp, tee, ctx.toernooi.allowance_pct) : null;
  const phEl = document.getElementById('scPHInfo');
  phEl.innerHTML = tee ? `Exacte hcp ${fH(speler.exact_hcp)} → playing hcp <b style="color:var(--gd)">${fPH(ctx.currentPH)}</b>` : 'Kies een tee om je playing handicap te zien.';
  const noTeeMsg = document.getElementById('scNoTeeMsg'), entryArea = document.getElementById('scEntryArea');
  if(noTeeMsg && entryArea){
    noTeeMsg.style.display = teeId ? 'none' : '';
    entryArea.style.display = teeId ? '' : 'none';
  }
  renderStrokeDots();
  recalcScoreLive();
}
function renderStrokeDots(){
  const ctx = window._scCtx;
  for(let i=0;i<18;i++){
    const el = document.getElementById('hstroke'+i);
    if(!el) continue;
    if(ctx.currentPH==null){ el.innerHTML=''; continue; }
    const sh = shots(ctx.currentPH, ctx.holes[i].si);
    el.innerHTML = sh>0 ? '<span class="dot"></span>'.repeat(Math.min(sh,2)) : (sh<0?'<span style="color:var(--red);font-size:.6rem">−</span>':'');
  }
}
function recalcScoreLive(){
  const ctx = window._scCtx;
  let bruto=0, sf=0, any=false;
  for(let i=0;i<18;i++){
    const inp = document.getElementById('h'+i);
    const pt = document.getElementById('pt'+i);
    const v = parseInt(inp.value);
    if(isNaN(v)){ pt.textContent='—'; pt.className='hpts pts-empty'; continue; }
    any=true; bruto+=v;
    if(ctx.currentPH==null){ pt.textContent='?'; pt.className='hpts pts-empty'; continue; }
    const sh = shots(ctx.currentPH, ctx.holes[i].si);
    const p = sfp(v, ctx.holes[i].par, sh);
    sf+=p;
    pt.textContent=p+'pt';
    pt.className = 'hpts '+(p===0?'pts-blob':p===1?'pts-1':p===2?'pts-2':p===3?'pts-3':'pts-4p');
  }
  document.getElementById('scBruto').textContent = any?bruto:'—';
  document.getElementById('scNetto').textContent = (any&&ctx.currentPH!=null)?(bruto-ctx.currentPH):'—';
  document.getElementById('scStbl').textContent = (any&&ctx.currentPH!=null)?sf:'—';
}
async function slaScoreOp(){
  const ctx = window._scCtx;
  const teeId = document.getElementById('scTee').value;
  if(!teeId){ toast('Kies eerst een tee', true); return; }
  const holeScores = [];
  for(let i=0;i<18;i++){
    const v = parseInt(document.getElementById('h'+i).value);
    holeScores.push(isNaN(v)?null:v);
  }
  const uitkomst = berekenScore(holeScores, ctx.holes, ctx.currentPH);
  const payload = {
    tee_id: teeId, hole_scores: holeScores, playing_hcp: ctx.currentPH,
    bruto: uitkomst.bruto, netto: uitkomst.netto, stableford: uitkomst.stableford,
    birdies_netto: uitkomst.birdies_netto, eagles_netto: uitkomst.eagles_netto,
    birdies_bruto: uitkomst.birdies_bruto, eagles_bruto: uitkomst.eagles_bruto,
    ingevoerd_door: isAdmin()?'admin':'speler', updated_at: new Date().toISOString()
  };
  try{
    if(ctx.existingScore) await sbPa('scores', ctx.existingScore.id, payload);
    else await sbP('scores', {ronde_id: ctx.rondeId, speler_id: ctx.spelerId, ...payload});
    closeModal('moScore');
    toast(uitkomst.compleet ? 'Score opgeslagen — kaart compleet' : 'Score tussentijds opgeslagen (nog niet alle holes ingevuld)');
    if(document.getElementById('panel-toernooi-detail').classList.contains('active')) openToernooiDetail(rondeById(ctx.rondeId).toernooi_id);
    if(document.getElementById('panel-beheer-toernooien').classList.contains('active')) renderBeheerToernooienPanel();
  }catch(e){ toast('Opslaan mislukt: '+e.message, true); }
}

/* =========================================================
   KLASSEMENT (Stableford / ABS strokeplay netto & bruto / Birdies)
   ========================================================= */
// Rondes met hetzelfde rapportagelabel tellen in het klassement als één kolom op
// (bijv. twee groepen die op verschillende dagen van baan wisselen: beide
// "American"-rondes krijgen zo samen één American-kolom). Zonder label krijgt
// elke ronde gewoon haar eigen kolom, met haar eigen naam.
function rondeLabel(r){ return (r.rapportage_label && r.rapportage_label.trim()) || r.naam; }
// ABS strokeplay: de score per hole wordt nooit hoger geteld dan het punt waarop de
// speler nog precies 0 stableford-punten haalt (WHS "net double bogey"-grens) — dus
// par + ontvangen slagen op die hole + 2. Bijv. par 5 met 1 slag mee -> max. 8.
function absStrokeplayVoorScore(score, holes){
  if(!score || !score.hole_scores || !holes || score.playing_hcp==null) return null;
  let bruto = 0;
  for(let i=0;i<18;i++){
    const v = score.hole_scores[i];
    if(v==null) return null;
    const cap = holes[i].par + shots(score.playing_hcp, holes[i].si) + 2;
    bruto += Math.min(v, cap);
  }
  return {bruto, netto: bruto - score.playing_hcp};
}
function countbackSegmentsSf(score, holes){
  if(!score || !score.hole_scores || !holes) return [0,0,0,0];
  const pH = score.playing_hcp;
  const pts = score.hole_scores.map((v,i)=> v==null?0:sfp(v, holes[i].par, shots(pH, holes[i].si)));
  const sum = arr=>arr.reduce((a,b)=>a+b,0);
  return [sum(pts.slice(9,18)), sum(pts.slice(12,18)), sum(pts.slice(15,18)), pts[17]||0];
}
function countbackSegmentsBruto(score){
  if(!score || !score.hole_scores) return [999,999,999,999];
  const vals = score.hole_scores.map(v=>v==null?0:v);
  const sum = arr=>arr.reduce((a,b)=>a+b,0);
  return [sum(vals.slice(9,18)), sum(vals.slice(12,18)), sum(vals.slice(15,18)), vals[17]||0];
}
// Tiebreak op de laatst gespeelde ronde (hoogste volgorde) van elke speler.
function countbackCompareSf(a,b){
  const sa = a.laatsteScore, sb = b.laatsteScore;
  if(!sa || !sb) return 0;
  const holesA = combinatieHoles(combinatieById(rondeById(sa.ronde_id)?.combinatie_id));
  const holesB = combinatieHoles(combinatieById(rondeById(sb.ronde_id)?.combinatie_id));
  const segA = countbackSegmentsSf(sa, holesA), segB = countbackSegmentsSf(sb, holesB);
  for(let i=0;i<4;i++){ if(segB[i]!==segA[i]) return segB[i]-segA[i]; }
  return 0;
}
function countbackCompareBruto(a,b){
  const segA = countbackSegmentsBruto(a.laatsteScore), segB = countbackSegmentsBruto(b.laatsteScore);
  for(let i=0;i<4;i++){ if(segA[i]!==segB[i]) return segA[i]-segB[i]; }
  return 0;
}

async function renderKlassementPanel(){
  const el = document.getElementById('panel-klassement');
  const lijst = mijnToernooien();
  if(!lijst.length){ el.innerHTML = '<div class="empty">Nog geen toernooien.</div>'; return; }
  let toernooiId = localStorage.getItem('klassementToernooi');
  if(!toernooiId || !lijst.find(t=>t.id===toernooiId)) toernooiId = lijst[0].id;
  localStorage.setItem('klassementToernooi', toernooiId);
  const geldigeModes = ['stableford','abs-netto','abs-bruto','birdie-bruto'];
  let mode = localStorage.getItem('klassementMode')||'stableford';
  if(!geldigeModes.includes(mode)) mode = 'stableford';
  el.innerHTML = `
  <div class="sh"><div><div class="st">Klassement</div></div></div>
  ${lijst.length>1?`<div class="fg"><select id="klsToernooi" onchange="wisselKlassementToernooi(this.value)">${lijst.map(t=>`<option value="${t.id}" ${t.id===toernooiId?'selected':''}>${esc(t.naam)}</option>`).join('')}</select></div>`:''}
  <div class="subtabs">
    <button class="subtab ${mode==='stableford'?'active':''}" onclick="wisselKlassementMode('stableford')">Stableford</button>
    <button class="subtab ${mode==='abs-netto'?'active':''}" onclick="wisselKlassementMode('abs-netto')">ABS strokeplay netto</button>
    <button class="subtab ${mode==='abs-bruto'?'active':''}" onclick="wisselKlassementMode('abs-bruto')">ABS strokeplay bruto</button>
    <button class="subtab ${mode==='birdie-bruto'?'active':''}" onclick="wisselKlassementMode('birdie-bruto')">Birdies</button>
  </div>
  <div id="klsBody"><div class="empty">Laden…</div></div>`;
  await tekenKlassementBody(toernooiId, mode);
}
function wisselKlassementToernooi(id){ localStorage.setItem('klassementToernooi', id); renderKlassementPanel(); }
function wisselKlassementMode(m){ localStorage.setItem('klassementMode', m); renderKlassementPanel(); }

async function tekenKlassementBody(toernooiId, mode){
  const rondes = allRondes.filter(r=>r.toernooi_id===toernooiId && r.status==='gesloten').sort((a,b)=>a.volgorde-b.volgorde);
  const body = document.getElementById('klsBody');
  if(!rondes.length){ body.innerHTML = '<div class="empty">Nog geen gesloten rondes — de uitslag verschijnt zodra de admin een ronde sluit.</div>'; return; }
  const scores = await laadScoresVoorToernooi(toernooiId);
  const rondeMap = {}; rondes.forEach(r=>rondeMap[r.id]=r);
  const relevant = scores.filter(s=>rondeMap[s.ronde_id]);

  // Kolommen = unieke rapportagelabels, in volgorde van eerst voorkomen.
  const labels = [];
  rondes.forEach(r=>{ const l=rondeLabel(r); if(!labels.includes(l)) labels.push(l); });

  const holesCache = {};
  function holesVoorRonde(r){
    if(!(r.id in holesCache)) holesCache[r.id] = combinatieHoles(combinatieById(r.combinatie_id));
    return holesCache[r.id];
  }

  const perSpeler = {};
  relevant.forEach(s=>{
    const r = rondeMap[s.ronde_id];
    const label = rondeLabel(r);
    if(!perSpeler[s.speler_id]) perSpeler[s.speler_id] = {speler_id:s.speler_id, perLabel:{}, totStableford:0, totAbsBruto:0, totAbsNetto:0, totBirdiesBruto:0, totEaglesBruto:0, aantalRondes:0, laatsteScore:null};
    const agg = perSpeler[s.speler_id];
    if(!agg.perLabel[label]) agg.perLabel[label] = {compleet:false, stableford:0, absBruto:0, absNetto:0, birdies_bruto:0, eagles_bruto:0};
    const pl = agg.perLabel[label];
    pl.birdies_bruto += s.birdies_bruto||0; pl.eagles_bruto += s.eagles_bruto||0;
    agg.totBirdiesBruto += s.birdies_bruto||0; agg.totEaglesBruto += s.eagles_bruto||0;
    if(s.stableford!=null){
      pl.compleet = true; pl.stableford += s.stableford;
      agg.totStableford += s.stableford; agg.aantalRondes++;
      const abs = absStrokeplayVoorScore(s, holesVoorRonde(r));
      if(abs){ pl.absBruto += abs.bruto; pl.absNetto += abs.netto; agg.totAbsBruto += abs.bruto; agg.totAbsNetto += abs.netto; }
    }
    if(!agg.laatsteScore || r.volgorde >= (rondeMap[agg.laatsteScore.ronde_id]?.volgorde ?? -Infinity)) agg.laatsteScore = s;
  });
  let rows = Object.values(perSpeler).filter(a=>a.aantalRondes>0);
  if(!rows.length){ body.innerHTML = '<div class="empty">Nog geen volledige kaarten in gesloten rondes.</div>'; return; }

  if(mode==='stableford') rows.sort((a,b)=> b.totStableford-a.totStableford || countbackCompareSf(a,b) || a.totAbsBruto-b.totAbsBruto);
  else if(mode==='abs-netto') rows.sort((a,b)=> a.totAbsNetto-b.totAbsNetto || countbackCompareBruto(a,b));
  else if(mode==='abs-bruto') rows.sort((a,b)=> a.totAbsBruto-b.totAbsBruto || countbackCompareBruto(a,b));
  else if(mode==='birdie-bruto') rows.sort((a,b)=> (b.totBirdiesBruto+b.totEaglesBruto)-(a.totBirdiesBruto+a.totEaglesBruto) || b.totEaglesBruto-a.totEaglesBruto);

  function cel(pl){
    if(!pl) return '<span style="color:var(--tl)">—</span>';
    if(!pl.compleet) return '<span style="color:var(--tl)">bezig</span>';
    if(mode==='stableford') return pl.stableford;
    if(mode==='abs-netto') return pl.absNetto;
    if(mode==='abs-bruto') return pl.absBruto;
    return pl.birdies_bruto+pl.eagles_bruto;
  }
  function totaal(a){
    if(mode==='stableford') return a.totStableford;
    if(mode==='abs-netto') return a.totAbsNetto;
    if(mode==='abs-bruto') return a.totAbsBruto;
    return a.totBirdiesBruto+a.totEaglesBruto;
  }

  body.innerHTML = `<div class="tw"><table><thead><tr>
    <th>#</th><th>Speler</th>
    ${labels.map(l=>`<th>${esc(l)}</th>`).join('')}
    <th>Totaal</th>
  </tr></thead><tbody>
  ${rows.map((a,i)=>{
    const sp = allSpelers.find(s=>s.id===a.speler_id);
    const rb = i===0?'r1':i===1?'r2':i===2?'r3':'ro';
    return `<tr>
      <td><span class="rb ${rb}">${i+1}</span></td>
      <td><b>${esc(sp?sp.naam:'?')}</b></td>
      ${labels.map(l=>`<td>${cel(a.perLabel[l])}</td>`).join('')}
      <td><b style="color:var(--gd)">${totaal(a)}</b></td>
    </tr>`;
  }).join('')}
  </tbody></table></div>
  ${mode==='stableford'?'<p style="font-size:.72rem;color:var(--tl);font-family:\'Inter\',sans-serif;margin-top:8px">Cijfers zijn netto Stableford-punten per kolom. Hoogste totaal wint.</p>':''}
  ${mode==='abs-netto'?'<p style="font-size:.72rem;color:var(--tl);font-family:\'Inter\',sans-serif;margin-top:8px">ABS (adjusted) netto strokeplay: score per hole gemaximeerd op het punt waarop nog precies 0 stablefordpunten worden gehaald (bijv. par 5 met 1 slag mee → max. 8), min playing handicap. Laagste totaal wint.</p>':''}
  ${mode==='abs-bruto'?'<p style="font-size:.72rem;color:var(--tl);font-family:\'Inter\',sans-serif;margin-top:8px">ABS (adjusted) bruto strokeplay: score per hole gemaximeerd op het punt waarop nog precies 0 stablefordpunten worden gehaald. Laagste totaal wint.</p>':''}
  ${mode==='birdie-bruto'?'<p style="font-size:.72rem;color:var(--tl);font-family:\'Inter\',sans-serif;margin-top:8px">Bruto birdies/eagles t.o.v. par (geen handicap-correctie).</p>':''}
  `;
}
