const MAANDEN_VOL = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const MAANDEN_KORT = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
// Datumrange van een toernooi (op basis van de rondes die al een datum hebben):
// zelfde maand+jaar -> "17-18 september 2026"; anders (maand en/of jaar verschilt)
// -> verkort "29 dec 26-3 jan 27". Geeft null als geen enkele ronde een datum heeft.
function toernooiDatumRange(toernooiId){
  const datums = allRondes.filter(r=>r.toernooi_id===toernooiId && r.datum).map(r=>r.datum).sort();
  if(!datums.length) return null;
  const eerste = new Date(datums[0]+'T00:00:00');
  const laatste = new Date(datums[datums.length-1]+'T00:00:00');
  if(eerste.getTime()===laatste.getTime()) return `${eerste.getDate()} ${MAANDEN_VOL[eerste.getMonth()]} ${eerste.getFullYear()}`;
  if(eerste.getMonth()===laatste.getMonth() && eerste.getFullYear()===laatste.getFullYear())
    return `${eerste.getDate()}-${laatste.getDate()} ${MAANDEN_VOL[eerste.getMonth()]} ${eerste.getFullYear()}`;
  const jaarKort = j => String(j).slice(-2);
  return `${eerste.getDate()} ${MAANDEN_KORT[eerste.getMonth()]} ${jaarKort(eerste.getFullYear())}-${laatste.getDate()} ${MAANDEN_KORT[laatste.getMonth()]} ${jaarKort(laatste.getFullYear())}`;
}

      <div class="brow"><button class="btn bp bsm" onclick="reageerDeelname('${mijnDeelname.id}','bevestigd')">Meedoen</button><button class="btn bg bsm" onclick="reageerDeelname('${mijnDeelname.id}','afgemeld')">Afmelden</button></div>
    </div></div>` : ''}
  ${rondesTeTonen.map(r=>{
    const comb = combinatieById(r.combinatie_id);

    const mijnScore = ingelogdSpeler ? scores.find(s=>s.ronde_id===r.id && s.speler_id===ingelogdSpeler.id) : null;
    const aantalIngevoerd = scores.filter(s=>s.ronde_id===r.id && s.stableford!=null).length;
    let mijnFlightHtml = '';
    let rondeFlightIds = new Set();
    if(ingelogdSpeler){
      rondeFlightIds = new Set(alleFlights.filter(f=>f.ronde_id===r.id).map(f=>f.id));
      const mijnFlightSpeler = alleFlightSpelers.find(fs=>rondeFlightIds.has(fs.flight_id) && fs.speler_id===ingelogdSpeler.id);
      if(mijnFlightSpeler){
        const flight = alleFlights.find(f=>f.id===mijnFlightSpeler.flight_id);

          .map(fs=>{ const sp = allSpelers.find(s=>s.id===fs.speler_id); return {id: fs.speler_id, naam: sp?sp.naam:'?'}; });
        const flightLeden = [{id: ingelogdSpeler.id, naam: ingelogdSpeler.naam}, ...medespelers];

  `;

async function openInvoerstatusModal(rondeId){
  const ronde = rondeById(rondeId);
  const comb = combinatieById(ronde.combinatie_id);
  const baan = comb ? baanById(comb.baan_id) : null;
  // Gebruikt dit toernooi de startlijst-functie? Dan spelen niet alle deelnemers
  // per se deze specifieke ronde (bijv. de helft speelt vandaag American, de
  // andere helft English) — toon dan alleen wie voor DEZE ronde is ingedeeld.
  const {flights, spelers: flightSpelers} = await laadFlightsVoorToernooi(ronde.toernooi_id);
  const gebruiktStartlijst = flights.length>0;
  let deeln = allDeelnemers.filter(d=>d.toernooi_id===ronde.toernooi_id && d.status!=='afgemeld');
  if(gebruiktStartlijst){
    const rondeFlightIds = new Set(flights.filter(f=>f.ronde_id===rondeId).map(f=>f.id));
    const spelerIdsInRonde = new Set(flightSpelers.filter(fs=>rondeFlightIds.has(fs.flight_id)).map(fs=>fs.speler_id));
    deeln = deeln.filter(d=>spelerIdsInRonde.has(d.speler_id));
  }
  let scores = [];
  try{ scores = await sbG('scores','ronde_id=eq.'+rondeId) || []; }
  catch(e){ toast('Kon scores niet laden: '+e.message, true); }
  const rows = deeln.map(d=>{
    const sp = allSpelers.find(s=>s.id===d.speler_id);
    if(!sp) return null;
    const sc = scores.find(s=>s.speler_id===sp.id);
    const compleet = !!(sc && sc.stableford!=null);
    const aantal = sc && sc.hole_scores ? sc.hole_scores.filter(v=>v!=null).length : 0;
    return {sp, compleet, aantal};
  }).filter(Boolean).sort((a,b)=>a.sp.naam.localeCompare(b.sp.naam));
  const aantalCompleet = rows.filter(r=>r.compleet).length;
  openModalHtml('moInvoerstatus', `<h3>${esc(baan?baan.naam:ronde.naam)}${comb?' — '+esc(comb.naam):''}</h3>

      ${rows.map(r=>`<div onclick="closeModal('moInvoerstatus');openScoreModal('${rondeId}','${r.sp.id}')"
          style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;background:${r.compleet?'#e8f5e9':'var(--redl)'};font-family:'Inter',sans-serif;font-size:.88rem">
        <span>${esc(r.sp.naam)}</span>
        <span style="font-weight:600;color:${r.compleet?'#2e7d32':'var(--red)'}">${r.compleet?'✓ Compleet':(r.aantal>0?r.aantal+'/18':'Nog niets')}</span>
      </div>`).join('') || `<div class="empty">${gebruiktStartlijst?'Nog geen startlijst ingevoerd voor deze ronde.':'Geen deelnemers voor dit toernooi.'}</div>`}
    </div>`);
}
// Volledige startlijst van een ronde, read-only — te openen door een deelnemer
// vanaf de Startlijst-knop op de toernooikaart. Toont alle flights (niet
// alleen die van de ingelogde speler) en kleurt namen naar teamkleur als er
// voor dit toernooi teams zijn aangemaakt.
async function openVolledigeStartlijstModal(rondeId){
  const ronde = rondeById(rondeId);
  const comb = combinatieById(ronde.combinatie_id);
  const baan = comb ? baanById(comb.baan_id) : null;
  openModalHtml('moVolledigeStartlijst', `<h3>Startlijst${baan?' — '+esc(baan.naam):''}</h3><div id="vstlBody"><div class="empty">Laden…</div></div>`);

  const teams = teamsVoorToernooi(ronde.toernooi_id);
  const body = document.getElementById('vstlBody');
  if(!body) return;
  if(!flights.length){ body.innerHTML = '<div class="empty">Nog geen startlijst ingevoerd voor deze ronde.</div>'; return; }
  body.innerHTML = `<div style="display:flex;flex-direction:column;gap:8px;max-height:65vh;overflow:auto">
    ${flights.slice().sort((a,b)=>a.volgorde-b.volgorde).map(f=>{
      const fSpelers = spelers.filter(fs=>fs.flight_id===f.id).sort((a,b)=>a.volgorde-b.volgorde);
      const namenHtml = fSpelers.map(fs=>{
        const sp = allSpelers.find(s=>s.id===fs.speler_id);
        const naam = sp?sp.naam:'?';
        let span = esc(naam);
        if(teams.length){
          const teamId = effectiefTeamId(fs.speler_id, rondeId, ronde.toernooi_id);
          const team = teamId ? teamById(teamId) : null;
          if(team) span = `<span style="color:${team.kleur};font-weight:600">${esc(naam)}</span>`;
        }
        return span + (fs.notitie?` <span class="hint">(${esc(fs.notitie)})</span>`:'');
      }).join(', ') || '—';
      const tijdHole = esc(f.starttijd||'—') + (f.start_hole?' · hole '+f.start_hole:'');
      return `<div class="rc"><div class="cb" style="padding:11px 13px">
        <div class="rm" style="font-weight:700;color:var(--gd)">${tijdHole}</div>
        <div class="rm" style="margin-top:2px">${namenHtml}</div>
      </div></div>`;
    }).join('')}
  </div>`;
}

  for(let i=0;i<holes.length;i++){

      <div class="hp">par <b>${h.par}</b> · si ${h.si}</div>

function onTeeChange(){

  const tee = teeId?teeById(teeId):null;
  const speler = allSpelers.find(s=>s.id===ctx.spelerId);
  ctx.currentPH = tee ? playingHandicap(speler.exact_hcp, tee, ctx.toernooi.allowance_pct) : null;
  const phEl = document.getElementById('scPHInfo');
  phEl.innerHTML = tee ? `Exacte hcp ${fH(speler.exact_hcp)} → playing hcp <b style="color:var(--gd)">${fPH(ctx.currentPH)}</b>` : 'Kies een tee om je playing handicap te zien.';
  const noTeeMsg = document.getElementById('scNoTeeMsg'), entryArea = document.getElementById('scEntryArea');
  if(noTeeMsg && entryArea){
    noTeeMsg.style.display = teeId ? 'none' : '';
    entryArea.style.display = teeId ? '' : 'none';
  }
  renderStrokeDots();
  recalcScoreLive();

function renderStrokeDots(){
  const ctx = window._scCtx;
  for(let i=0;i<18;i++){
    const el = document.getElementById('hstroke'+i);
    if(!el) continue;
    if(ctx.currentPH==null){ el.innerHTML=''; continue; }
    const sh = shots(ctx.currentPH, ctx.holes[i].si);
    el.innerHTML = sh>0 ? '<span class="dot"></span>'.repeat(Math.min(sh,2)) : (sh<0?'<span style="color:var(--red);font-size:.6rem">−</span>':'');
  }
}
function recalcScoreLive(){
  const ctx = window._scCtx;
  let bruto=0, sf=0, any=false;
  for(let i=0;i<ctx.holes.length;i++){
    const inp = document.getElementById('h'+i);
    const pt = document.getElementById('pt'+i);
    const v = parseInt(inp.value);
    if(isNaN(v)){ pt.textContent='—'; pt.className='hpts pts-empty'; continue; }
    any=true; bruto+=v;
    if(ctx.currentPH==null){ pt.textContent='?'; pt.className='hpts pts-empty'; continue; }
    const sh = shots(ctx.currentPH, ctx.holes[i].si);
    const p = sfp(v, ctx.holes[i].par, sh);
    sf+=p;
    pt.textContent=p+'pt';
    pt.className = 'hpts '+(p===0?'pts-blob':p===1?'pts-1':p===2?'pts-2':p===3?'pts-3':'pts-4p');
  }
  document.getElementById('scBruto').textContent = any?bruto:'—';
  document.getElementById('scNetto').textContent = (any&&ctx.currentPH!=null)?(bruto-ctx.currentPH):'—';
  document.getElementById('scStbl').textContent = (any&&ctx.currentPH!=null)?sf:'—';
}
// Springt automatisch naar de volgende hole zodra er een geldige score is
// ingetikt, zodat je gewoon 18x (of 9x) een cijfer kunt intikken zonder tab
// of muis. Bij "1" wordt even (kort) gewacht, want dat kan ook het begin
// zijn van 10/11/12 — bij elk ander cijfer (2-9) of zodra er een tweede
// cijfer bij komt, springt hij meteen door. Op de laatste hole springt hij
// naar de "Score opslaan"-knop in plaats van naar een volgende hole.
let _holeAdvanceTimer = null;
function scoreInputVeranderd(i, aantalHoles){
  recalcScoreLive();
  if(_holeAdvanceTimer){ clearTimeout(_holeAdvanceTimer); _holeAdvanceTimer=null; }
  const raw = document.getElementById('h'+i).value;
  if(raw===''){ return; }
  const n = parseInt(raw,10);
  if(isNaN(n) || n<1){ return; }
  if(raw.length>=2 || n>=2){
    naarVolgendeHole(i, aantalHoles);
  } else {
    _holeAdvanceTimer = setTimeout(()=>naarVolgendeHole(i, aantalHoles), 600);
  }
}
function naarVolgendeHole(i, aantalHoles){
  if(i+1<aantalHoles){
    const next = document.getElementById('h'+(i+1));
    if(next){ next.focus(); if(next.select) next.select(); }
  } else {
    const btn = document.getElementById('scOpslaanBtn');
    if(btn) btn.focus();
  }
}

    birdies_bruto: uitkomst.birdies_bruto, eagles_bruto: uitkomst.eagles_bruto,
    ingevoerd_door: isAdmin()?'admin':'speler', updated_at: new Date().toISOString()
  };
  try{
    if(ctx.existingScore) await sbPa('scores', ctx.existingScore.id, payload);
    else await sbP('scores', {ronde_id: ctx.rondeId, speler_id: ctx.spelerId, ...payload});
    closeModal('moScore');
    toast(uitkomst.compleet ? 'Score opgeslagen — kaart compleet' : 'Score tussentijds opgeslagen (nog niet alle holes ingevuld)');
    if(document.getElementById('panel-toernooi-detail').classList.contains('active')) openToernooiDetail(rondeById(ctx.rondeId).toernooi_id);
    if(document.getElementById('panel-beheer-toernooien').classList.contains('active')) renderBeheerToernooienPanel();
  }catch(e){ toast('Opslaan mislukt: '+e.message, true); }

/* =========================================================
   KLASSEMENT (Stableford / ABS strokeplay netto & bruto / Birdies)
   ========================================================= */
// Rondes met hetzelfde rapportagelabel tellen in het klassement als één kolom op
// (bijv. twee groepen die op verschillende dagen van baan wisselen: beide
// "American"-rondes krijgen zo samen één American-kolom). Zonder label krijgt
// elke ronde gewoon haar eigen kolom, met haar eigen naam.
function rondeLabel(r){ return (r.rapportage_label && r.rapportage_label.trim()) || r.naam; }
// Breedte van een ronde-kolom in het Klassement, afgestemd op de lengte van
// het label zelf (i.p.v. één vaste breedte voor alle rondes) — zo blijft er
// op smalle (telefoon)schermen meer ruimte over voor de Speler-kolom.
function rondeKolomBreedte(label){ return Math.max(58, Math.min(120, 18 + String(label||'').length*7)); }
// Breedte van de Speler/Team-kolom in het Klassement, afgestemd op de langste
// naam die er daadwerkelijk in moet — zo blijft de kolom altijd breed genoeg
// voor namen als "Kay van de Linde", ongeacht hoeveel ronde-kolommen ernaast
// staan of hoe smal het scherm is (bij plaatsgebrek scrollt de tabel, i.p.v.
// dat deze kolom dichtslibt of namen over de ronde-koppen heen lopen).
function naamKolomBreedte(namen){
  const maxLen = (namen||[]).reduce((m,n)=>Math.max(m, String(n||'').length), 8);
  return Math.max(90, Math.min(200, 22 + maxLen*7));
}
/* =========================================================
   SPELVORMEN PER RONDE — Regulier / 2x3-5x4-2x5 / Hidden holes, + Boost
   Beïnvloedt alleen het Stableford-klassement (en dus ook de Teams-subtab,
   die daarop voortbouwt) — ABS strokeplay en Birdies blijven ongewijzigd,
   die zijn per definitie gebaseerd op de volledige, ongefilterde kaart.
   ========================================================= */
// Netto stableford-punten per hole voor deze kaart (18 lang), 0 waar leeg.
function stablefordPtsPerHole(score, holes){
  const pH = score.playing_hcp;
  return score.hole_scores.map((v,i)=> v==null?0:sfp(v, holes[i].par, shots(pH, holes[i].si)));
}
// Het 'effectieve' aantal stableford-punten dat een kaart meetelt voor het
// klassement van deze ronde: bij spelvorm 'regulier' zonder boost gewoon
// score.stableford (ongewijzigd gedrag); anders eerst de spelvorm toepassen
// (welke holes tellen mee) en daarna de boost-factor.
function effectieveStablefordVoorRonde(score, ronde, holes){
  if(score.stableford==null) return null;
  const spelvorm = ronde.spelvorm || 'regulier';
  let basis = score.stableford;
  if(spelvorm !== 'regulier' && holes && holes.length){
    const pts = stablefordPtsPerHole(score, holes);
    if(spelvorm === 'hidden_holes'){
      const hh = (ronde.hidden_holes && ronde.hidden_holes.length) ? ronde.hidden_holes : null;
      basis = hh ? hh.reduce((som,holeNr)=> som + (pts[holeNr-1]||0), 0) : score.stableford;
    } else if(spelvorm === '2x3_5x4_2x5'){
      const perPar = {3:[], 4:[], 5:[]};
      holes.forEach((h,i)=>{ if(perPar[h.par]) perPar[h.par].push(pts[i]); });
      const besteN = (arr,n)=> arr.slice().sort((a,b)=>b-a).slice(0,n).reduce((a,b)=>a+b,0);
      basis = besteN(perPar[3],2) + besteN(perPar[4],5) + besteN(perPar[5],2);
    }
  }
  const boost = ronde.boost_pct || 100;
  // Afgerond op halve punten — boost-percentages als 150%/25% geven anders lelijke decimalen.
  return Math.round(basis * (boost/100) * 2) / 2;
}
// Leesbaar label voor de kolomkop in het klassement, bv. "Hidden Holes · Boost 150%".
function spelvormLabel(ronde){
  if(!ronde) return '';
  const boost = ronde.boost_pct || 100;
  // Boost is in de ronde-editor een eigen, losstaande keuze (naast Regulier/
  // 2x3-5x4-2x5/Hidden holes) — dus als een ronde geboost is, toont het
  // klassement alleen "Boost X%", niet ook nog "Regulier" ervoor.
  if(boost!==100) return 'Boost '+boost+'%';
  const spelvorm = ronde.spelvorm || 'regulier';
  return spelvorm==='2x3_5x4_2x5' ? '2x3/5x4/2x5' : spelvorm==='hidden_holes' ? 'Hidden Holes' : 'Regulier';
}
// Compacte weergave van een (mogelijk halve) puntentotaal: geen ".0" bij hele getallen.
function fmtPts(n){
  if(n==null) return '—';
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}
// ABS strokeplay: de score per hole wordt nooit hoger geteld dan het punt waarop de
// speler nog precies 0 stableford-punten haalt (WHS "net double bogey"-grens) — dus
// par + ontvangen slagen op die hole + 2. Bijv. par 5 met 1 slag mee -> max. 8.
function absStrokeplayVoorScore(score, holes){
  if(!score || !score.hole_scores || !holes || score.playing_hcp==null) return null;
  let bruto = 0;
  for(let i=0;i<18;i++){
    const v = score.hole_scores[i];
    if(v==null) return null;
    const cap = holes[i].par + shots(score.playing_hcp, holes[i].si) + 2;
    bruto += Math.min(v, cap);
  }
  return {bruto, netto: bruto - score.playing_hcp};
}
function countbackSegmentsSf(score, holes){
  if(!score || !score.hole_scores || !holes) return [0,0,0,0];
  const pH = score.playing_hcp;
  const pts = score.hole_scores.map((v,i)=> v==null?0:sfp(v, holes[i].par, shots(pH, holes[i].si)));
  const sum = arr=>arr.reduce((a,b)=>a+b,0);
  return [sum(pts.slice(9,18)), sum(pts.slice(12,18)), sum(pts.slice(15,18)), pts[17]||0];
}
function countbackSegmentsBruto(score){
  if(!score || !score.hole_scores) return [999,999,999,999];
  const vals = score.hole_scores.map(v=>v==null?0:v);
  const sum = arr=>arr.reduce((a,b)=>a+b,0);
  return [sum(vals.slice(9,18)), sum(vals.slice(12,18)), sum(vals.slice(15,18)), vals[17]||0];
}
// Tiebreak op de laatst gespeelde ronde (hoogste volgorde) van elke speler.
function countbackCompareSf(a,b){
  const sa = a.laatsteScore, sb = b.laatsteScore;
  if(!sa || !sb) return 0;
  const holesA = combinatieHoles(combinatieById(rondeById(sa.ronde_id)?.combinatie_id));
  const holesB = combinatieHoles(combinatieById(rondeById(sb.ronde_id)?.combinatie_id));
  const segA = countbackSegmentsSf(sa, holesA), segB = countbackSegmentsSf(sb, holesB);
  for(let i=0;i<4;i++){ if(segB[i]!==segA[i]) return segB[i]-segA[i]; }
  return 0;
}
function countbackCompareBruto(a,b){
  const segA = countbackSegmentsBruto(a.laatsteScore), segB = countbackSegmentsBruto(b.laatsteScore);
  for(let i=0;i<4;i++){ if(segA[i]!==segB[i]) return segA[i]-segB[i]; }
  return 0;
}

// De scoringstypes (zie SCORING_TYPE_OPTS) die ergens in dit toernooi bij een
// ronde zijn aangevinkt — bepaalt welke klassement-tabbladen links van
// Birdies/Funnies/Teams verschijnen. Een ronde zonder scoring_types (bv. omdat
// de migratie nog niet gedraaid is) telt als de drie standaardtypes, zodat een
// toernooi er niet ineens leger uitziet.
function actieveScoringTypes(toernooiId){
  const rondes = allRondes.filter(r=>r.toernooi_id===toernooiId);
  const set = new Set();
  rondes.forEach(r=>{
    const types = (Array.isArray(r.scoring_types) && r.scoring_types.length) ? r.scoring_types : ['stableford','abs-netto','abs-bruto'];
    types.forEach(t=>set.add(t));
  });
  return SCORING_TYPE_OPTS.map(o=>o.v).filter(v=>set.has(v));
}
async function renderKlassementPanel(){
  const el = document.getElementById('panel-klassement');
  const lijst = mijnToernooien();
  if(!lijst.length){ el.innerHTML = '<div class="empty">Nog geen toernooien.</div>'; return; }
  let toernooiId = localStorage.getItem('klassementToernooi');
  if(!toernooiId || !lijst.find(t=>t.id===toernooiId)) toernooiId = lijst[0].id;
  localStorage.setItem('klassementToernooi', toernooiId);
  const actieveTypes = actieveScoringTypes(toernooiId);
  const vasteModes = ['birdie-bruto','extra','teams'];
  const geldigeModes = [...actieveTypes, ...vasteModes];
  let mode = localStorage.getItem('klassementMode')||'stableford';
  if(!geldigeModes.includes(mode)) mode = actieveTypes[0] || 'birdie-bruto';
  el.innerHTML = `
  <div class="sh"><div><div class="st">Klassement</div></div><button class="btn bg bsm" onclick="exporteerKlassementPdf()">Exporteer PDF</button></div>
  ${lijst.length>1?`<div class="fg"><select id="klsToernooi" onchange="wisselKlassementToernooi(this.value)">${lijst.map(t=>`<option value="${t.id}" ${t.id===toernooiId?'selected':''}>${esc(t.naam)}</option>`).join('')}</select></div>`:''}
  <div class="subtabs">
    ${actieveTypes.map(t=>`<button class="subtab ${mode===t?'active':''}" onclick="wisselKlassementMode('${t}')">${esc(KLASSEMENT_MODE_LABELS[t])}</button>`).join('')}
    <button class="subtab ${mode==='birdie-bruto'?'active':''}" onclick="wisselKlassementMode('birdie-bruto')">Birdies</button>
    <button class="subtab ${mode==='extra'?'active':''}" onclick="wisselKlassementMode('extra')">Funnies</button>
    <button class="subtab ${mode==='teams'?'active':''}" onclick="wisselKlassementMode('teams')">Teams</button>
  </div>
  <div id="klsBody"><div class="empty">Laden…</div></div>`;
  await tekenKlassementBody(toernooiId, mode);
}
function wisselKlassementToernooi(id){ localStorage.setItem('klassementToernooi', id); renderKlassementPanel(); }
function wisselKlassementMode(m){ localStorage.setItem('klassementMode', m); renderKlassementPanel(); }
const KLASSEMENT_MODE_LABELS = {
  'stableford':'Stableford', 'abs-netto':'ABS Netto', 'abs-bruto':'ABS Bruto',
  'strokeplay-netto':'Strokeplay Netto', 'strokeplay-bruto':'Strokeplay Bruto',
  'birdie-bruto':'Birdies', 'extra':'Funnies', 'teams':'Teams'
};
// Exporteert precies wat er nu op het scherm staat (huidig toernooi + subtab)
// als PDF. Leest de al gerenderde tabel in #klsBody uit i.p.v. alles opnieuw
// te berekenen, zodat export altijd exact overeenkomt met wat je ziet. Voor
// subtabs zonder tabel (bv. Funnies) wordt de zichtbare tekst geëxporteerd.
function exporteerKlassementPdf(){
  if(!window.jspdf){ toast('PDF-export kon niet laden — controleer je internetverbinding en probeer opnieuw.', true); return; }
  const body = document.getElementById('klsBody');
  if(!body || body.querySelector('.empty')){ toast('Niets om te exporteren.', true); return; }
  const { jsPDF } = window.jspdf;
  const toernooiId = localStorage.getItem('klassementToernooi');
  const toernooi = toernooiId ? toernooiById(toernooiId) : null;
  const mode = localStorage.getItem('klassementMode') || 'stableford';
  const modeLabel = KLASSEMENT_MODE_LABELS[mode] || mode;
  const titel = (toernooi ? toernooi.naam : 'Klassement') + ' — ' + modeLabel;
  const doc = new jsPDF({orientation:'portrait'});
  doc.setFontSize(14);
  doc.text(titel, 14, 16);
  doc.setFontSize(9);
  doc.setTextColor(120);
  doc.text('Geëxporteerd op ' + fDatum(vandaagStr()) + ' — Rondje!', 14, 22);
  doc.setTextColor(0);
  const table = body.querySelector('table');
  if(table){
    const head = [Array.from(table.querySelectorAll('thead th')).map(th=>th.innerText.replace(/\s+/g,' ').trim())];
    const rows = Array.from(table.querySelectorAll('tbody tr')).map(tr=>Array.from(tr.querySelectorAll('td')).map(td=>td.innerText.replace(/\s+/g,' ').trim()));
    doc.autoTable({
      head, body: rows, startY: 28,
      styles:{fontSize:7, halign:'center'},
      headStyles:{fillColor:[26,58,42]},
      didParseCell: function(data){
        if(data.column.index <= 1){ data.cell.styles.halign = 'left'; }
      }
    });
  } else {
    const tekst = body.innerText.trim() || 'Geen gegevens.';
    doc.setFontSize(10);
    doc.text(doc.splitTextToSize(tekst, 180), 14, 30);
  }
  const bestandsnaam = ((toernooi?toernooi.naam:'klassement')+'-'+modeLabel).toLowerCase()
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') + '.pdf';
  doc.save(bestandsnaam);
}

async function tekenKlassementBody(toernooiId, mode){
  const admin = isAdmin();
  const rondes = allRondes.filter(r=>r.toernooi_id===toernooiId && (r.status==='gesloten' || admin)).sort((a,b)=>a.volgorde-b.volgorde);
  const body = document.getElementById('klsBody');
  if(mode==='extra'){ renderExtraPrijzenKlassementBody(body, rondes, admin); return; }
  if(!rondes.length){ body.innerHTML = `<div class="empty">${admin?'Nog geen rondes aangemaakt.':'Nog geen gesloten rondes — de uitslag verschijnt zodra de admin een ronde sluit.'}</div>`; return; }
  const scores = await laadScoresVoorToernooi(toernooiId);
  const rondeMap = {}; rondes.forEach(r=>rondeMap[r.id]=r);
  const relevant = scores.filter(s=>rondeMap[s.ronde_id]);

  // Kolommen = unieke rapportagelabels, in volgorde van eerst voorkomen.
  const labels = [];
  rondes.forEach(r=>{ const l=rondeLabel(r); if(!labels.includes(l)) labels.push(l); });
  // Labels die (nog) een open ronde bevatten — admin ziet die als live/voorlopig.
  const liveLabels = new Set();
  rondes.forEach(r=>{ if(r.status==='open') liveLabels.add(rondeLabel(r)); });

  const holesCache = {};
  function holesVoorRonde(r){
    if(!(r.id in holesCache)) holesCache[r.id] = combinatieHoles(combinatieById(r.combinatie_id));
    return holesCache[r.id];
  }

  const perSpeler = {};
  relevant.forEach(s=>{
    const r = rondeMap[s.ronde_id];
    const label = rondeLabel(r);
    if(!perSpeler[s.speler_id]) perSpeler[s.speler_id] = {speler_id:s.speler_id, perLabel:{}, totStableford:0, totAbsBruto:0, totAbsNetto:0, totStrokeplayBruto:0, totStrokeplayNetto:0, totBirdiesBruto:0, totEaglesBruto:0, aantalRondes:0, laatsteScore:null};
    const agg = perSpeler[s.speler_id];
    if(!agg.perLabel[label]) agg.perLabel[label] = {compleet:false, stableford:0, absBruto:0, absNetto:0, strokeplayBruto:0, strokeplayNetto:0, birdies_bruto:0, eagles_bruto:0, scoreIds:[]};
    const pl = agg.perLabel[label];
    pl.scoreIds.push(s.id);
    pl.birdies_bruto += s.birdies_bruto||0; pl.eagles_bruto += s.eagles_bruto||0;
    agg.totBirdiesBruto += s.birdies_bruto||0; agg.totEaglesBruto += s.eagles_bruto||0;
    if(s.stableford!=null){
      pl.compleet = true;
      const eff = effectieveStablefordVoorRonde(s, r, holesVoorRonde(r));
      pl.stableford += eff; agg.totStableford += eff; agg.aantalRondes++;
      const abs = absStrokeplayVoorScore(s, holesVoorRonde(r));
      if(abs){ pl.absBruto += abs.bruto; pl.absNetto += abs.netto; agg.totAbsBruto += abs.bruto; agg.totAbsNetto += abs.netto; }
      pl.strokeplayBruto += s.bruto||0; pl.strokeplayNetto += s.netto||0;
      agg.totStrokeplayBruto += s.bruto||0; agg.totStrokeplayNetto += s.netto||0;
    }
    if(!agg.laatsteScore || r.volgorde >= (rondeMap[agg.laatsteScore.ronde_id]?.volgorde ?? -Infinity)) agg.laatsteScore = s;
  });
  let rows = Object.values(perSpeler).filter(a=>a.aantalRondes>0);
  if(!rows.length){ body.innerHTML = `<div class="empty">${admin?'Nog geen scores ingevoerd.':'Nog geen volledige kaarten in gesloten rondes.'}</div>`; return; }

  if(mode==='teams'){ renderTeamsKlassementBody(body, toernooiId, rondes, labels, liveLabels, perSpeler, admin); return; }

  if(mode==='stableford') rows.sort((a,b)=> b.totStableford-a.totStableford || countbackCompareSf(a,b) || a.totAbsBruto-b.totAbsBruto);
  else if(mode==='abs-netto') rows.sort((a,b)=> a.totAbsNetto-b.totAbsNetto || countbackCompareBruto(a,b));
  else if(mode==='abs-bruto') rows.sort((a,b)=> a.totAbsBruto-b.totAbsBruto || countbackCompareBruto(a,b));
  else if(mode==='strokeplay-netto') rows.sort((a,b)=> a.totStrokeplayNetto-b.totStrokeplayNetto || countbackCompareBruto(a,b));
  else if(mode==='strokeplay-bruto') rows.sort((a,b)=> a.totStrokeplayBruto-b.totStrokeplayBruto || countbackCompareBruto(a,b));
  else if(mode==='birdie-bruto') rows.sort((a,b)=> (b.totBirdiesBruto+b.totEaglesBruto)-(a.totBirdiesBruto+a.totEaglesBruto) || b.totEaglesBruto-a.totEaglesBruto);

  function cel(pl){
    if(!pl) return '<span style="color:var(--tl)">—</span>';
    if(!pl.compleet) return '<span style="color:var(--tl)">bezig</span>';
    if(mode==='stableford') return fmtPts(pl.stableford);
    if(mode==='abs-netto') return pl.absNetto;
    if(mode==='abs-bruto') return pl.absBruto;
    if(mode==='strokeplay-netto') return pl.strokeplayNetto;
    if(mode==='strokeplay-bruto') return pl.strokeplayBruto;
    return pl.birdies_bruto+pl.eagles_bruto;
  }
  function totaal(a){
    if(mode==='stableford') return fmtPts(a.totStableford);
    if(mode==='abs-netto') return a.totAbsNetto;
    if(mode==='abs-bruto') return a.totAbsBruto;
    if(mode==='strokeplay-netto') return a.totStrokeplayNetto;
    if(mode==='strokeplay-bruto') return a.totStrokeplayBruto;
    return a.totBirdiesBruto+a.totEaglesBruto;
  }
  // Alleen als minstens één ronde van dit toernooi een niet-standaard spelvorm
  // en/of boost heeft, tonen we onder de kolomkoppen om welke spelvorm het gaat
  // (Regulier blijft dan ook zichtbaar, ter onderscheid met de afwijkende rondes).
  const toonSpelvormen = rondes.some(r=>(r.spelvorm && r.spelvorm!=='regulier') || (r.boost_pct && r.boost_pct!==100));
  const spelerBreedte = naamKolomBreedte(rows.map(a=>{ const sp = allSpelers.find(s=>s.id===a.speler_id); return sp?sp.naam:''; }));
  const rkw = Math.max(108, ...labels.map(l=>rondeKolomBreedte(l)));

  body.innerHTML = `
  ${(admin && liveLabels.size)?`<p style="font-size:.72rem;color:var(--gd);font-family:'Inter',sans-serif;margin-bottom:8px">🔴 Leaderboard — Pas zichtbaar voor deelnemers nadat je de ronde sluit.</p>`:''}
  <div class="tw"><table style="table-layout:fixed;--rkw:${rkw}px"><thead><tr>
    <th style="width:38px;vertical-align:top">#</th><th style="width:${spelerBreedte}px;vertical-align:top">Speler</th>
    ${labels.map(l=>{
      const r0 = rondes.find(r=>rondeLabel(r)===l);
      return `<th class="rk" style="text-align:center;vertical-align:top;width:${rondeKolomBreedte(l)}px;white-space:normal;line-height:1">${esc(l)}${toonSpelvormen?`<div style="font-weight:400;text-transform:none;letter-spacing:0;font-size:.64rem;opacity:.85;line-height:1;margin-top:2px">${esc(spelvormLabel(r0))}</div>`:''}</th>`;
    }).join('')}
    <th style="text-align:center;vertical-align:top;width:78px;white-space:normal">Totaal</th>
  </tr></thead><tbody>
  ${rows.map((a,i)=>{
    const sp = allSpelers.find(s=>s.id===a.speler_id);
    const rb = i===0?'r1':i===1?'r2':i===2?'r3':'ro';
    return `<tr>
      <td><span class="rb ${rb}">${i+1}</span></td>
      <td><b>${esc(sp?sp.naam:'?')}</b></td>
      ${labels.map(l=>{
        const pl = a.perLabel[l];
        const klikbaar = pl && pl.scoreIds && pl.scoreIds.length;
        return `<td style="text-align:center"${klikbaar?` class="klikbaar" onclick='openScorekaartPopup(${JSON.stringify(pl.scoreIds)})'`:''}>${cel(pl)}</td>`;
      }).join('')}
      <td style="text-align:center"><b style="color:var(--gd)">${totaal(a)}</b></td>
    </tr>`;
  }).join('')}
  </tbody></table></div>
  ${mode==='stableford'?'<p style="font-size:.72rem;color:var(--tl);font-family:\'Inter\',sans-serif;margin-top:8px">Cijfers zijn netto Stableford-punten per kolom. Hoogste totaal wint.</p>':''}
  ${mode==='abs-netto'?'<p style="font-size:.72rem;color:var(--tl);font-family:\'Inter\',sans-serif;margin-top:8px">ABS (adjusted) netto strokeplay: score per hole gemaximeerd op het punt waarop nog precies 0 stablefordpunten worden gehaald (bijv. par 5 met 1 slag mee → max. 8), min playing handicap. Laagste totaal wint.</p>':''}
  ${mode==='abs-bruto'?'<p style="font-size:.72rem;color:var(--tl);font-family:\'Inter\',sans-serif;margin-top:8px">ABS (adjusted) bruto strokeplay: score per hole gemaximeerd op het punt waarop nog precies 0 stablefordpunten worden gehaald. Laagste totaal wint.</p>':''}
  ${mode==='strokeplay-netto'?'<p style="font-size:.72rem;color:var(--tl);font-family:\'Inter\',sans-serif;margin-top:8px">Strokeplay netto: totaal aantal slagen min playing handicap, zonder aftopping per hole. Laagste totaal wint.</p>':''}
  ${mode==='strokeplay-bruto'?'<p style="font-size:.72rem;color:var(--tl);font-family:\'Inter\',sans-serif;margin-top:8px">Strokeplay bruto: totaal aantal slagen, zonder aftopping per hole en zonder handicap-correctie. Laagste totaal wint.</p>':''}
  ${mode==='birdie-bruto'?'<p style="font-size:.72rem;color:var(--tl);font-family:\'Inter\',sans-serif;margin-top:8px">Bruto birdies/eagles t.o.v. par (geen handicap-correctie).</p>':''}
  `;
}
// Teams-subtab van het klassement: hergebruikt 'perSpeler' (dezelfde
// per-speler, per-ronde-label Stableford-aggregatie als het individuele
// klassement hierboven) en telt per team de punten van de teamleden bij
// elkaar op — via effectiefTeamId, dus inclusief eventuele per-ronde
// uitzonderingen op de standaardindeling.
function renderTeamsKlassementBody(body, toernooiId, rondes, labels, liveLabels, perSpeler, admin){
  const teams = teamsVoorToernooi(toernooiId);
  if(!teams.length){
    body.innerHTML = `<div class="empty">${admin?'Nog geen teams aangemaakt — ga naar Toernooien beheer → Teams beheren.':'Nog geen teams ingedeeld voor dit toernooi.'}</div>`;
    return;
  }
  const perTeam = {};
  teams.forEach(tm=>{ perTeam[tm.id] = {team:tm, perLabel:{}, totaal:0}; });
  rondes.forEach(r=>{
    const label = rondeLabel(r);
    Object.values(perSpeler).forEach(agg=>{
      const pl = agg.perLabel[label];
      if(!pl || !pl.compleet) return;
      const teamId = effectiefTeamId(agg.speler_id, r.id, toernooiId);
      if(!teamId || !perTeam[teamId]) return;
      const tAgg = perTeam[teamId];
      if(tAgg.perLabel[label]==null) tAgg.perLabel[label] = 0;
      tAgg.perLabel[label] += pl.stableford;
      tAgg.totaal += pl.stableford;
    });
  });
  const teamRows = Object.values(perTeam).sort((a,b)=>b.totaal-a.totaal);
  const toonSpelvormen = rondes.some(r=>(r.spelvorm && r.spelvorm!=='regulier') || (r.boost_pct && r.boost_pct!==100));
  const teamBreedte = naamKolomBreedte(teamRows.map(t=>t.team?t.team.naam:''));
  const rkw = Math.max(108, ...labels.map(l=>rondeKolomBreedte(l)));
  body.innerHTML = `
  ${(admin && liveLabels.size)?`<p style="font-size:.72rem;color:var(--gd);font-family:'Inter',sans-serif;margin-bottom:8px">🔴 Leaderboard — Pas zichtbaar voor deelnemers nadat je de ronde sluit.</p>`:''}
  <div class="tw"><table style="table-layout:fixed;--rkw:${rkw}px"><thead><tr>
    <th style="width:38px;vertical-align:top">#</th><th style="width:${teamBreedte}px;vertical-align:top">Team</th>
    ${labels.map(l=>{
      const r0 = rondes.find(r=>rondeLabel(r)===l);
      return `<th class="rk" style="text-align:center;vertical-align:top;width:${rondeKolomBreedte(l)}px;white-space:normal;line-height:1">${esc(l)}${toonSpelvormen?`<div style="font-weight:400;text-transform:none;letter-spacing:0;font-size:.64rem;opacity:.85;line-height:1;margin-top:2px">${esc(spelvormLabel(r0))}</div>`:''}</th>`;
    }).join('')}
    <th style="text-align:center;vertical-align:top;width:78px;white-space:normal">Totaal</th>
  </tr></thead><tbody>
  ${teamRows.map((tAgg,i)=>{
    const rb = i===0?'r1':i===1?'r2':i===2?'r3':'ro';
    return `<tr>
      <td><span class="rb ${rb}">${i+1}</span></td>
      <td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${tAgg.team.kleur};margin-right:6px;vertical-align:middle"></span><b>${esc(tAgg.team.naam)}</b></td>
      ${labels.map(l=>`<td style="text-align:center">${tAgg.perLabel[l]!=null?fmtPts(tAgg.perLabel[l]):'<span style="color:var(--tl)">—</span>'}</td>`).join('')}
      <td style="text-align:center"><b style="color:var(--gd)">${fmtPts(tAgg.totaal)}</b></td>
    </tr>`;
  }).join('')}
  </tbody></table></div>
  <p style="font-size:.72rem;color:var(--tl);font-family:'Inter',sans-serif;margin-top:8px">Teamscore = som van de netto Stableford-punten van de teamleden per ronde. Hoogste totaal wint.</p>
  `;
}

/* =========================================================
   SCOREKAART-POPUP (klikbaar vanuit het klassement)
   ========================================================= */
function fSign(n){
  if(n==null||isNaN(n)) return '—';
  if(n===0) return '—';
  return n>0 ? '+'+n : String(n);
}
function ptsClass(pts){
  if(pts==null) return '';
  return pts===0?'pts-blob':pts===1?'pts-1':pts===2?'pts-2':pts===3?'pts-3':'pts-4p';
}
// Eén label kan meerdere gesloten rondes bundelen (rapportage_label) — laat dan
// eerst kiezen welke ronde-kaart je wilt zien. Anders direct de kaart openen.
async function openScorekaartPopup(scoreIds){
  if(!scoreIds || !scoreIds.length) return;
  if(scoreIds.length===1){ await renderScorekaartPopup(scoreIds[0]); return; }
  let scores = [];
  try{ scores = await sbG('scores','id=in.('+scoreIds.join(',')+')') || []; }
  catch(e){ toast('Kon kaarten niet laden: '+e.message, true); return; }
  openModalHtml('moScorekaart', `<h3>Welke ronde?</h3>
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
      ${scores.map(s=>{
        const r = rondeById(s.ronde_id);
        const comb = r?combinatieById(r.combinatie_id):null;
        return `<button class="btn bg" onclick="renderScorekaartPopup('${s.id}')">${esc(r?r.naam:'?')}${comb?' — '+esc(comb.naam):''}${r&&r.datum?' · '+fDatum(r.datum):''}</button>`;
      }).join('')}
      <button class="btn bg bf" onclick="closeModal('moScorekaart')">Annuleren</button>
    </div>`);
}
// Toont de volledige scorekaart (per hole par/si/lopend-netto/score/netto/stableford,
// met OUT/IN/TOTAAL-subtotalen) van één opgeslagen score-record.
async function renderScorekaartPopup(scoreId){
  let scoreRows = [];
  try{ scoreRows = await sbG('scores','id=eq.'+scoreId) || []; }
  catch(e){ toast('Kon scorekaart niet laden: '+e.message, true); return; }
  const score = scoreRows[0];
  if(!score){ toast('Scorekaart niet gevonden', true); return; }
  const ronde = rondeById(score.ronde_id);
  const comb = ronde?combinatieById(ronde.combinatie_id):null;
  const baan = comb?baanById(comb.baan_id):null;
  const holes = combinatieHoles(comb);
  const speler = allSpelers.find(s=>s.id===score.speler_id);
  if(!holes || !speler){ toast('Kon rondegegevens niet laden', true); return; }
  const pH = score.playing_hcp;
  const vals = score.hole_scores || new Array(holes.length).fill(null);
  const helft = Math.ceil(holes.length/2);

  let lopend = 0;
  const per = holes.map((h,i)=>{
    const v = vals[i];
    const sh = pH!=null ? shots(pH, h.si) : null;
    const netto = (v!=null && sh!=null) ? v-sh : null;
    const pts = (v!=null && sh!=null) ? sfp(v, h.par, sh) : null;
    if(netto!=null) lopend += (netto-h.par);
    return {par:h.par, si:h.si, score:v, netto, pts, lopend: netto!=null?lopend:null};
  });

  const kolommen = [];
  per.forEach((p,i)=>{
    kolommen.push({type:'hole', i});
    if(i===helft-1) kolommen.push({type:'sub', label:'OUT', from:0, to:helft});
  });
  if(holes.length>helft) kolommen.push({type:'sub', label:'IN', from:helft, to:holes.length});
  kolommen.push({type:'total'});

  let headerHtml = '<tr><th>Hole</th>';
  kolommen.forEach(k=>{
    headerHtml += k.type==='hole' ? `<th>${k.i+1}</th>` : k.type==='sub' ? `<th>${esc(k.label)}</th>` : '<th>Tot</th>';
  });
  headerHtml += '</tr>';

  function rijHtml(label, holeTd, subVal, totalVal){
    let html = `<tr><td>${esc(label)}</td>`;
    kolommen.forEach(k=>{
      if(k.type==='hole') html += holeTd(per[k.i]);
      else if(k.type==='sub') html += `<td class="sk-sub">${subVal(k)}</td>`;
      else html += `<td class="sk-sub">${totalVal()}</td>`;
    });
    return html+'</tr>';
  }
  const alleCompleet = (veld)=> per.every(x=>x[veld]!=null);
  const somSegment = (k,veld)=> per.slice(k.from,k.to).every(x=>x[veld]!=null) ? per.slice(k.from,k.to).reduce((a,x)=>a+x[veld],0) : '—';
  const somTotaal = (veld)=> alleCompleet(veld) ? per.reduce((a,x)=>a+x[veld],0) : '—';

  const rijenHtml = [
    rijHtml('Par', p=>`<td>${p.par}</td>`, k=>somSegment(k,'par'), ()=>somTotaal('par')),
    rijHtml('SI', p=>`<td>${p.si}</td>`, ()=>'—', ()=>'—'),
    rijHtml('Shots', p=>`<td>${fSign(p.lopend)}</td>`, k=>fSign(per[k.to-1].lopend), ()=>fSign(per[per.length-1].lopend)),
    rijHtml('Score', p=>`<td class="${ptsClass(p.pts)}">${p.score!=null?p.score:'—'}</td>`, k=>somSegment(k,'score'), ()=>somTotaal('score')),
    rijHtml('Netto', p=>`<td>${p.netto!=null?p.netto:'—'}</td>`, k=>somSegment(k,'netto'), ()=>somTotaal('netto')),
    rijHtml('Sfd', p=>`<td class="${ptsClass(p.pts)}">${p.pts!=null?p.pts:'—'}</td>`, k=>somSegment(k,'pts'), ()=>somTotaal('pts')),
  ].join('');

  const subtitel = [
    ronde&&ronde.datum?fDatum(ronde.datum):null,
    baan?baan.naam+(comb?' — '+comb.naam:''):null,
    `Start hcp: ${fH(speler.exact_hcp)}`,
    `Playing hcp: ${fPH(pH)}`
  ].filter(Boolean).map(esc).join(' · ');

  openModalHtml('moScorekaart', `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <h3>${esc(speler.naam)} — Scorekaart</h3>
      <button class="btn bg bsm" onclick="closeModal('moScorekaart')" style="flex-shrink:0;padding:8px 13px" aria-label="Sluiten">×</button>
    </div>
    <p style="font-size:.78rem;color:var(--tm);font-family:'Inter',sans-serif;margin:-4px 0 12px">${subtitel}</p>
    <div class="tw sk"><table><thead>${headerHtml}</thead><tbody>${rijenHtml}</tbody></table></div>
    ${score.stableford!=null?`<p style="font-family:'Inter',sans-serif;margin-top:10px"><b>Totaal stableford: ${score.stableford}</b></p>`:'<div class="empty" style="margin-top:10px">Kaart nog niet compleet.</div>'}
    <button class="btn bg bf" style="margin-top:12px" onclick="closeModal('moScorekaart')">Sluiten</button>
  `);
}
</script>
