<style>
:root {
  --gd: #1a3a2a; --gm: #2d5a3d; --gl: #4a8c5c; --gp: #c8e6c9;
  --cr: #f5f0e8; --cd: #ede5d0;
  --gold: #c9a84c; --goldl: #f0d878;
  --wh: #ffffff; --td: #1a1a1a; --tm: #4a4a4a; --tl: #6b7a6b;
  --red: #c0392b; --redl: #fadbd8;
  --blue: #1565c0; --bluel: #e3f2fd;
  --purple: #6a4c93; --purplel: #ede7f6;
  --sh: 0 4px 20px rgba(0,0,0,0.15); --shsm: 0 2px 8px rgba(0,0,0,0.08);
  --r: 6px; --rl: 12px;
  --hh: 56px; --nh: 62px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:'IBM Plex Sans','Inter',sans-serif;background:var(--cr);color:var(--td);padding-bottom:calc(var(--nh) + env(safe-area-inset-bottom))}

/* HEADER */
.hdr{background:var(--gd);position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:200;box-shadow:var(--sh);display:flex;align-items:center;justify-content:space-between;padding:0 16px;padding-top:env(safe-area-inset-top)}
.logo-t{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:900;color:var(--gold)}
.logo-s{font-family:'IBM Plex Mono',monospace;font-size:0.6rem;color:rgba(200,230,200,0.65);letter-spacing:.08em;text-transform:uppercase;display:block;margin-top:-1px}
.hdr-r{display:flex;gap:8px;align-items:center}
.adm-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:var(--cr);font-family:'IBM Plex Mono',monospace;font-size:.7rem;padding:7px 13px;border-radius:20px;cursor:pointer}
.adm-badge{background:var(--gold);color:var(--gd);font-family:'IBM Plex Mono',monospace;font-size:.65rem;padding:5px 11px;border-radius:20px;font-weight:700;border:none;cursor:pointer}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;height:var(--nh);padding-bottom:env(safe-area-inset-bottom);background:var(--gd);display:flex;z-index:200;box-shadow:0 -2px 20px rgba(0,0,0,.2)}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:rgba(200,230,200,.55);font-family:'IBM Plex Sans',sans-serif;font-size:.52rem;font-weight:500;cursor:pointer;padding:6px 2px;letter-spacing:.02em;transition:color .15s}
.ntab .ic{font-size:1.05rem;line-height:1}
.ntab.active{color:var(--gold)}
.ntab.active .ic{transform:translateY(-2px)}

/* MAIN */
.main{padding-top:calc(var(--hh) + 14px);padding-bottom:14px;min-height:100vh;max-width:640px;width:100%;margin:0 auto;box-sizing:border-box}
@media (min-width:641px){ .main{max-width:min(1400px, 96vw)} }
/* Op tablet/laptop krijgen alle ronde-kolommen in het Klassement weer dezelfde
   (uniforme) breedte, zodat de titelbalk een strak, gelijkmatig rooster blijft.
   Die breedte wordt per render berekend (--rkw, zie tekenKlassementBody /
   renderTeamsKlassementBody) op basis van de langste ronde-naam. Op telefoon
   (smal scherm) blijft elke kolom precies zo breed als zijn eigen ronde-naam
   vraagt (zie rondeKolomBreedte), zodat de Speler-kolom niet dichtslibt. */
@media (min-width:641px){ .rk{width:var(--rkw, 108px) !important} }
.panel{display:none;padding:0 13px}
.panel.active{display:block}

/* SECTION */
.sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;padding-top:2px;gap:8px}
.st{font-family:'Playfair Display',serif;font-size:1.45rem;font-weight:700;color:var(--gd)}
.ss{font-size:.7rem;color:var(--tl);font-family:'Inter',sans-serif;font-weight:500}

/* CARD */
.card{background:var(--wh);border-radius:var(--rl);box-shadow:var(--shsm);margin-bottom:8px;overflow:hidden;border:1px solid rgba(0,0,0,.05)}
.ch{padding:13px 15px 10px;border-bottom:1px solid var(--cd);display:flex;align-items:center;justify-content:space-between;gap:8px}
.ct{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;color:var(--gd)}
.cb{padding:14px 15px}

/* STATS */
.srow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.srow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.sc{background:var(--wh);border-radius:var(--rl);padding:13px 15px;box-shadow:var(--shsm);border-left:4px solid var(--gl)}
.sv{font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:700;color:var(--gd);line-height:1}
.sl{font-family:'Inter',sans-serif;font-weight:500;font-size:.63rem;color:var(--tl);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* TABLE */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{background:var(--gd);color:var(--cr);padding:9px 9px;text-align:left;font-family:'Inter',sans-serif;font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;font-weight:600;white-space:nowrap}
td{padding:10px 9px;border-bottom:1px solid var(--cd);vertical-align:middle;font-size:14px;line-height:1.4}
tr:last-child td{border-bottom:none}

/* BADGES */
.rb{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:50%;font-family:'IBM Plex Mono',monospace;font-size:.68rem;font-weight:700;flex-shrink:0}
.r1{background:var(--gold);color:var(--gd)}.r2{background:#c0c0c0;color:#333}.r3{background:#cd7f32;color:#fff}.ro{background:var(--cd);color:var(--tm)}
.hb{display:inline-block;padding:3px 8px;border-radius:20px;font-family:'Inter',sans-serif;font-size:.75rem;font-weight:600;background:var(--gp);color:var(--gd)}
.sp{display:inline-block;padding:5px 11px;border-radius:20px;font-size:.78rem;font-family:'Inter',sans-serif;font-weight:600;white-space:nowrap}
.so{background:#e8f5e9;color:#2e7d32}.sc2{background:var(--cd);color:var(--tm)}.sa{background:var(--redl);color:var(--red)}.sg{background:#f0f0f0;color:#888}.sbdg{background:var(--bluel);color:var(--blue)}
.pb{display:inline-block;padding:3px 8px;border-radius:20px;font-family:'Inter',sans-serif;font-size:.75rem;font-weight:700;background:#fff9c4;color:#795548}
.teecirc{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:.62rem;font-weight:700;font-family:'IBM Plex Mono',monospace;border:1.5px solid rgba(0,0,0,.15);flex-shrink:0}

/* FORMS */
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.fg label{font-size:.68rem;font-weight:600;color:var(--tm);letter-spacing:.04em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace}
.fg input,.fg select,.fg textarea{padding:12px 13px;border:1.5px solid var(--cd);border-radius:var(--r);font-family:'IBM Plex Sans',sans-serif;font-size:.95rem;color:var(--td);background:var(--cr);width:100%;-webkit-appearance:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--gl);background:var(--wh)}
.fg .hint{font-size:.7rem;color:var(--tl);font-family:'Inter',sans-serif;font-weight:400;text-transform:none;letter-spacing:0}
.fg .hh-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.fg label.hh-box{display:flex;align-items:center;gap:7px;font-size:.82rem;font-weight:600;text-transform:none;letter-spacing:0;font-family:'IBM Plex Sans',sans-serif;color:var(--td);border:1.5px solid var(--cd);border-radius:var(--r);padding:8px 12px;cursor:pointer;background:var(--cr);transition:background .12s,border-color .12s,color .12s;user-select:none}
.fg label.hh-box.aan{background:var(--gd);border-color:var(--gd);color:var(--wh)}
.fg label.hh-box input.hh-cb{-webkit-appearance:checkbox;appearance:checkbox;width:17px;height:17px;padding:0;margin:0;border:none;background:none;flex-shrink:0;accent-color:var(--gl);cursor:pointer}
#rnSpelvormExtra:empty{display:none}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* BUTTONS */
.btn{font-family:'IBM Plex Sans',sans-serif;font-size:.88rem;font-weight:600;padding:13px 20px;border-radius:var(--r);border:none;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;-webkit-appearance:none}
.btn:active{transform:scale(.97)}
.bp{background:var(--gm);color:#fff}.bg{background:var(--cd);color:var(--td)}.bd{background:var(--red);color:#fff}.bgo{background:var(--gold);color:var(--gd)}.bbl{background:var(--blue);color:#fff}.bpu{background:var(--purple);color:#fff}
.bf{width:100%}.bsm{padding:8px 13px;font-size:.76rem}
.stl-locked{opacity:.45;pointer-events:none}
.brow{display:flex;gap:8px;flex-wrap:wrap}

/* TABS (sub-navigation within a panel, e.g. klassement netto/bruto) */
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.subtab{flex-shrink:0;background:var(--wh);border:1.5px solid var(--cd);color:var(--tm);font-family:'Inter',sans-serif;font-size:.75rem;font-weight:600;padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap}
.subtab.active{background:var(--gd);border-color:var(--gd);color:var(--gold)}

/* RONDE / TOERNOOI CARDS */
.rc{background:var(--wh);border-radius:var(--rl);box-shadow:var(--shsm);margin-bottom:6px;border:1px solid rgba(0,0,0,.05);overflow:hidden}
.rch{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;cursor:pointer;gap:8px}
.rd{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--gd)}
.rm{font-family:'Inter',sans-serif;font-size:.8rem;color:var(--tl);margin-top:3px}
.ra{display:flex;gap:8px;padding:10px 15px;border-top:1px solid var(--cd);background:var(--cr);flex-wrap:wrap}

/* SCORE ENTRY GRID */
.holerow{display:grid;grid-template-columns:22px 1fr 28px 44px 40px;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--cd)}
.holerow:last-child{border-bottom:none}
.holerow .hn{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--tl);text-align:center}
.holerow .hp{font-family:'Inter',sans-serif;font-size:.72rem;color:var(--tm)}
.holerow .hp b{color:var(--gd)}
.holerow .hstroke{display:flex;justify-content:center}
.hstroke .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.holerow input{width:44px;height:40px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:1rem;font-weight:700;border:2px solid var(--cd);border-radius:var(--r);background:var(--cr);padding:0;-webkit-appearance:none}
.holerow input:focus{outline:none;border-color:var(--gl);background:#fff}
.hpts{font-family:'Inter',sans-serif;font-size:.68rem;font-weight:700;text-align:center;padding:4px 2px;border-radius:20px;background:var(--cd);color:var(--tm)}
.pts-empty{background:transparent;color:var(--tl)}
.pts-blob{background:var(--redl);color:var(--red)}
.pts-1{background:#f0f0f0;color:#888}
.pts-2{background:var(--bluel);color:var(--blue)}
.pts-3{background:#e8f5e9;color:#2e7d32}
.pts-4p{background:#fff3e0;color:#e65100}
.klikbaar{cursor:pointer}
.sk table{font-family:'IBM Plex Mono',monospace}
.sk th,.sk td{text-align:center;padding:6px 8px;white-space:nowrap;font-size:.72rem}
.sk th:first-child,.sk td:first-child{position:sticky;left:0;text-align:left;font-family:'Inter',sans-serif;font-weight:600;background:var(--wh);z-index:1}
.sk th:first-child{background:var(--gd)}
.sk .sk-sub{background:var(--cr);font-weight:700}
/* Spelersbeheer-tabel: vaste kolombreedtes zodat Naam/Hcp/Status/Toernooien/Acties
   netjes naast elkaar staan i.p.v. dat de browser de ruimte willekeurig verdeelt. */
.spelerstabel{table-layout:fixed;min-width:680px}
.spelerstabel th:nth-child(1),.spelerstabel td:nth-child(1){width:24%}
.spelerstabel th:nth-child(2),.spelerstabel td:nth-child(2){width:8%}
.spelerstabel th:nth-child(3),.spelerstabel td:nth-child(3){width:10%}
.spelerstabel th:nth-child(4),.spelerstabel td:nth-child(4){width:20%}
.spelerstabel th:nth-child(5),.spelerstabel td:nth-child(5){width:38%}
.spelerstabel td:nth-child(5) .brow{flex-wrap:nowrap}
.spelerstabel td:nth-child(5) .btn{white-space:nowrap}
/* Op desktop breekt de Spelers-tabel uit de smalle (mobiel-georiënteerde) .main-kolom
   zodat de Acties-kolom nooit buiten beeld valt — i.p.v. horizontaal te moeten scrollen. */
@media (min-width:700px){
  #panel-beheer-spelers .tw{width:100vw;max-width:100vw;margin-left:calc(50% - 50vw);padding:0 20px;box-sizing:border-box}
  #panel-beheer-spelers .spelerstabel{width:100%;max-width:1100px;margin:0 auto}
}
/* Scorekaart-popup: op een telefoon in landscape (laag & breed scherm) alles
   op het scherm laten passen, zonder te hoeven scrollen — net als in de
   Wintercup-app. Alleen van toepassing op de scorekaart-modal (#moScorekaart). */
@media (orientation:landscape) and (max-height:520px){
  #moScorekaart{align-items:center;padding-bottom:0}
  #moScorekaart .md{width:98vw;max-width:98vw;max-height:96vh;padding:8px 14px;overflow-y:auto}
  #moScorekaart .md h3{font-size:.92rem;margin-bottom:2px}
  #moScorekaart .mh{margin:0 auto 6px}
  #moScorekaart p{margin:0 0 6px!important;font-size:.68rem!important}
  #moScorekaart .sk th,#moScorekaart .sk td{padding:2px 4px;font-size:.6rem}
  #moScorekaart .sk th:first-child,#moScorekaart .sk td:first-child{font-size:.62rem}
  #moScorekaart button{padding:6px 10px!important;margin-top:6px!important;font-size:.78rem}
}
/* Desktop: de scorekaart-modal mag breder dan de standaard 520px, zodat alle
   holes + OUT/IN/TOTAAL in één keer zichtbaar zijn zonder horizontaal scrollen. */
@media (min-width:700px){
  #moScorekaart .md{width:96vw;max-width:min(1200px,96vw)}
}
.ssumm{background:var(--cr);border:1px solid var(--cd);border-radius:var(--rl);padding:10px 6px;font-family:'Inter',sans-serif;display:flex;flex-direction:row;gap:0;margin:12px 0}
.si2{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;border-right:1px solid var(--cd);padding:4px 2px}.si2:last-child{border-right:none}
.sv2{font-size:1.1rem;font-weight:700;color:var(--gd);font-family:'Inter',sans-serif}
.sl2{font-size:.56rem;color:var(--tl);text-transform:uppercase;letter-spacing:.04em;font-family:'Inter',sans-serif;font-weight:600}

/* MODAL */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;align-items:flex-end;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.mo.open{display:flex}
.md{background:var(--wh);border-radius:var(--rl) var(--rl) 0 0;padding:20px;width:100%;max-width:520px;box-shadow:var(--sh);max-height:88vh;overflow-y:auto}
.md h3{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--gd);margin-bottom:14px}
.mh{width:36px;height:4px;background:var(--cd);border-radius:2px;margin:0 auto 14px}

/* SETUP */
.sbox{background:var(--gd);color:var(--cr);border-radius:var(--rl);padding:18px;margin-bottom:14px}
.sbox h3{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--gold);margin-bottom:10px}
.sbox p{font-size:.82rem;line-height:1.6;margin-bottom:6px}
.sbox code{background:rgba(255,255,255,.15);padding:1px 5px;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:.78rem}
.step{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px}
.snum{background:var(--gold);color:var(--gd);width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:.68rem;font-weight:700;flex-shrink:0;margin-top:2px}
.empty{text-align:center;padding:28px 16px;color:var(--tl);font-style:italic;font-size:.84rem}
pre.sqlbox{background:rgba(0,0,0,.25);border-radius:8px;padding:12px;font-family:'IBM Plex Mono',monospace;font-size:.68rem;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow-y:auto;margin:10px 0}

/* TOAST */
.tc{position:fixed;top:calc(var(--hh) + 8px);left:0;right:0;z-index:500;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{background:var(--gd);color:var(--wh);font-family:'Inter',sans-serif;font-size:.82rem;font-weight:500;padding:10px 18px;border-radius:20px;box-shadow:var(--sh);max-width:420px;text-align:center}
.toast.err{background:var(--red)}

.hide{display:none!important}
</style>
</head>

/* ---------- HOLE ALLOCATIE (WHS-methode) ---------- */
// Hoeveel slagen krijgt/geeft een speler op een hole met gegeven stroke index (1-18),
// bij een playing handicap pH (positief = hoger dan scratch, negatief = plus-hcp).
function shots(pH, si){
  const abs = Math.abs(pH);
  const base = Math.floor(abs/18);
  const extra = abs%18;
  const s = base + (si<=extra?1:0);
  return pH<0 ? -s : s;
}
// Netto stableford-punten voor één hole.
function sfp(score, par, sh){
  if(score==null || isNaN(score)) return null;
  const n = score - par - sh;
  if(n>=2) return 0;
  if(n===1) return 1;
  if(n===0) return 2;
  if(n===-1) return 3;
  if(n===-2) return 4;
  return 5;
}

/* ---------- WHS HANDICAP FORMULES ---------- */
// Course Handicap = Exact HCP x (Slope/113) + (Course Rating - Par)
function courseHandicap(exactHcp, slope, courseRating, par){
  if(exactHcp==null || slope==null || courseRating==null || par==null) return null;
  const ch = parseFloat(exactHcp) * (slope/113) + (courseRating - par);
  return Math.round(ch);
}
// Playing Handicap = Course Handicap x toernooi-allowance% (default 100)
function playingHandicap(exactHcp, tee, allowancePct){
  if(!tee) return null;
  const ch = courseHandicap(exactHcp, tee.slope_rating, tee.course_rating, tee.par);
  if(ch==null) return null;
  const pct = (allowancePct==null?100:allowancePct)/100;
  return Math.round(ch*pct);
}

/* ---------- FORMATTERS ---------- */
function fH(h){ // format handicap: positief normaal, negatief als "+x"
  if(h==null||isNaN(h)) return '—';
  const n = parseFloat(h);
  return n<0 ? ('+'+Math.abs(n).toFixed(1).replace(/\.0$/,'')) : n.toFixed(1).replace(/\.0$/,'');
}
function fPH(h){
  if(h==null||isNaN(h)) return '—';
  return h<0 ? ('+'+Math.abs(h)) : String(h);
}
function fDatum(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'});
}
// Vandaag als 'YYYY-MM-DD' string (lokale tijd) — zo vergelijkbaar met ronde.datum.
function vandaagStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// Spelers mogen pas scoren vanaf de speeldag van de ronde; admin mag altijd (bijv. om alvast te testen).
function magNogNietScoren(ronde){
  return !isAdmin() && !!ronde.datum && vandaagStr() < ronde.datum;
}
// 'YYYY-MM-DD' + n dagen (n mag negatief) -> nieuwe 'YYYY-MM-DD' (lokale tijd).
function dagenVerschuiven(datumStr, n){
  const d = new Date(datumStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// Scopen van het inlogscherm: een speler staat alleen in de naamlijst als hij
// deelnemer is aan minstens één toernooi waarvan het datumvenster nu actief
// is — vanaf 7 dagen vóór de eerste ronde t/m 24 uur na de laatste ronde.
// Een toernooi zonder rondedatums (nog) blokkeert niet (fail-open), zodat een
// vergeten datum nooit per ongeluk iemand van inloggen uitsluit. Dit is puur
// voor de leesbaarheid van het inlogscherm — eenmaal ingelogd ziet een speler
// via mijnToernooien() gewoon al zijn toernooien, ongeacht dit venster.
function speelbaarVoorLogin(spelerId){
  const mijnToernooiIds = allDeelnemers.filter(d=>d.speler_id===spelerId).map(d=>d.toernooi_id);
  if(!mijnToernooiIds.length) return false;
  const vandaag = vandaagStr();
  return mijnToernooiIds.some(tId=>{
    const datums = allRondes.filter(r=>r.toernooi_id===tId && r.datum).map(r=>r.datum).sort();
    if(!datums.length) return true;
    const vanaf = dagenVerschuiven(datums[0], -7);
    const totEnMet = dagenVerschuiven(datums[datums.length-1], 1);
    return vandaag >= vanaf && vandaag <= totEnMet;
  });
}
// Voor automatisch uitloggen: true als ALLE toernooien van deze speler meer
// dan 24 uur geleden zijn afgelopen. Kijkt bewust alleen naar het einde van
// het venster (niet het begin zoals speelbaarVoorLogin) — een toernooi dat
// nog moet beginnen, of waarvan de rondes (nog) geen datum hebben, mag nooit
// iemand uitloggen. Iemand zonder toernooien wordt hierom ook nooit uitgelogd.
function spelerToernooienAfgelopen(spelerId){
  const mijnToernooiIds = allDeelnemers.filter(d=>d.speler_id===spelerId).map(d=>d.toernooi_id);
  if(!mijnToernooiIds.length) return false;
  const vandaag = vandaagStr();
  return mijnToernooiIds.every(tId=>{
    const datums = allRondes.filter(r=>r.toernooi_id===tId && r.datum).map(r=>r.datum).sort();
    if(!datums.length) return false;
    const totEnMet = dagenVerschuiven(datums[datums.length-1], 1);
    return vandaag > totEnMet;
  });
}

/* ---------- PBKDF2 HASHING (pincodes & wachtwoorden) ---------- */
function randomSalt(){
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hashMet(pin, salt){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pin), {name:'PBKDF2'}, false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt: enc.encode(salt), iterations: 100000, hash:'SHA-256'}, keyMaterial, 256);
  return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function maakHash(pin){
  const salt = randomSalt();
  const hash = await hashMet(pin, salt);
  return salt+'$'+hash;
}
async function verifieerHash(pin, opgeslagen){
  if(!opgeslagen || !opgeslagen.includes('$')) return false;
  const [salt, hash] = opgeslagen.split('$');
  const test = await hashMet(pin, salt);
  return test===hash;
}
const ZWAKKE_PINS = new Set(['0000','1111','2222','3333','4444','5555','6666','7777','8888','9999','1234','2345','3456','4567','5678','6789','7890','4321','5432','6543','7654','8765','9876','0987','1212','2121','1010','0101']);
// Willekeurige 4-cijferige pincode (geen zwakke) — gebruikt bij het automatisch
// aanmaken van spelersaccounts tijdens een startlijst-import.
function genereerRandomPin(){
  let pin;
  do{
    const bytes = new Uint8Array(2);
    crypto.getRandomValues(bytes);
    pin = String(((bytes[0]<<8)|bytes[1])%10000).padStart(4,'0');
  } while(ZWAKKE_PINS.has(pin));
  return pin;
}

/* ---------- SUPABASE REST HELPERS ---------- */
async function sbFetch(path, opts={}){
  let r;
  try{
    // Ondersteunt zowel de oude (JWT) anon key als de nieuwe "Publishable key"
    // (sb_publishable_...). Die laatste is geen JWT en hoort volgens Supabase
    // alleen in de apikey-header te staan, niet in Authorization: Bearer.
    const isJwt = SBK.startsWith('eyJ');
    r = await fetch(SBU+'/rest/v1/'+path, {
      method: opts.method||'GET',
      headers: {'apikey':SBK, ...(isJwt?{'Authorization':'Bearer '+SBK}:{}), 'Content-Type':'application/json','Prefer':opts.prefer||'return=representation',...(opts.headers||{})},
      body: opts.body!=null ? JSON.stringify(opts.body) : undefined
    });
  }catch(networkErr){
    throw new Error('Netwerkfout ('+networkErr.message+'). Controleer je internetverbinding en of het Supabase-project actief is.');
  }
  if(!r.ok){
    let t=''; try{ t=await r.text(); }catch(_){}
    let msg=t;
    try{ const j=JSON.parse(t); msg=j.message||j.error||t; }catch(_){}
    throw new Error(msg||('HTTP '+r.status));
  }
  if(r.status===204) return null;
  const txt = await r.text();
  if(!txt) return null;
  try{ return JSON.parse(txt); }catch(_){ return null; }
}
const sbG  = (t,q='') => sbFetch(t+'?'+q);
const sbP  = (t,b)    => sbFetch(t, {method:'POST', body:b});
const sbPa = (t,id,b) => sbFetch(t+'?id=eq.'+id, {method:'PATCH', body:b, prefer:'return=representation'});
const sbD  = (t,id)   => sbFetch(t+'?id=eq.'+id, {method:'DELETE', prefer:'return=minimal'});

  if(!/[0-9]/.test(pwd)) return 'Wachtwoord moet minimaal één cijfer bevatten';

  if(!u||!k){ toast('Vul in elk geval de Project URL en key in', true); return; }
  SBU=u; SBK=k;
  try{
    const bestaand = await sbG('admins','select=id&limit=1');
    if(bestaand && bestaand.length){
      // Er bestaat al een admin-account (bijv. bij het openen van de app op een nieuw
      // domein/device) — gewoon verbinden met de bestaande data, geen nieuw account aanmaken.
      localStorage.setItem('sbUrl', u);
      localStorage.setItem('sbKey', k);
      toast('Verbonden! Log in met je bestaande admin-account.');
      await boot();
      return;
    }
    if(!naam||!pwd){ toast('Vul ook een admin-naam en wachtwoord in om het eerste account aan te maken', true); return; }
    const pwdErr = validPwd(pwd);
    if(pwdErr){ toast(pwdErr, true); return; }
    const hash = await maakHash(pwd);
    await sbP('admins', {naam, pwd_hash:hash});
    localStorage.setItem('sbUrl', u);
    localStorage.setItem('sbKey', k);
    toast('Verbonden! Eerste admin-account aangemaakt.');
    await boot();
  }catch(e){
    toast('Setup mislukt: '+e.message, true);
  }
}

/* =========================================================
   INIT
   ========================================================= */
window.onload = async ()=>{
  // Val terug op lokaal opgeslagen credentials als de broncode nog leeg is
  if(!SBU) SBU = localStorage.getItem('sbUrl')||'';
  if(!SBK) SBK = localStorage.getItem('sbKey')||'';
  if(!SBU || !SBK){
    document.getElementById('panel-setup').classList.add('active');
    renderSetupPanel();
    return;
  }
  await boot();
};

async function boot(){
  document.querySelectorAll('.panel').forEach(p=>{ p.classList.remove('active'); p.innerHTML=''; });
  try{
    await laadAlles();
    setupRealtime();
  }catch(e){
    toast('Kan Supabase niet bereiken: '+e.message, true);
  }
  // Sessie herstellen
  let spId = localStorage.getItem('speler_id');
  const adNaam = localStorage.getItem('admin_naam');
  // Je kunt niet tegelijk als speler én als admin ingelogd zijn. Uit een
  // eerdere versie van de app konden beide sleutels toch naast elkaar zijn
  // blijven staan — ruim dat hier op (admin heeft voorrang) zodat oude,
  // dubbele sessies vanzelf herstellen bij de eerstvolgende keer laden.
  if(spId && adNaam){ localStorage.removeItem('speler_id'); spId = null; }
  if(spId){
    ingelogdSpeler = allSpelers.find(s=>s.id===spId) || null;
    if(!ingelogdSpeler) localStorage.removeItem('speler_id');
    else if(spelerToernooienAfgelopen(ingelogdSpeler.id)){
      // Alle toernooien van deze speler zijn meer dan 24 uur geleden afgelopen
      // — automatisch uitloggen i.p.v. de sessie te herstellen.
      ingelogdSpeler = null;
      localStorage.removeItem('speler_id');
      toast('Je bent automatisch uitgelogd — je toernooi is afgelopen.');
    }
  }
  if(adNaam){
    // Admin-sessie: we bewaren alleen de naam lokaal; echte check gebeurt bij gevoelige acties niet opnieuw
    // (eenvoudige MVP-aanpak — zie opmerking bij setup over edge functions voor hardening)
    const rec = await sbG('admins','naam=eq.'+encodeURIComponent(adNaam)+'&select=id,naam').catch(()=>[]);
    if(rec && rec[0]) ingelogdAdmin = rec[0];
    else localStorage.removeItem('admin_naam');
  }
  renderHeader();
  renderNav();
  if(ingelogdSpeler || isAdmin()){
    const last = localStorage.getItem('laatstePanel');
    const tabs = navConfig().map(t=>t.p);
    showPanel(tabs.includes(last)?last:tabs[0]);
  } else {
    document.getElementById('panel-login').classList.add('active');
    renderLoginPanel();
  }
  startSpelerVervalCheck();
}
// Vangt het geval dat iemand het tabblad gewoon open laat staan tot ver na
// afloop van zijn toernooi (zonder de app opnieuw te laden, wat bovenstaande
// check bij boot() al afvangt) — elke 30 minuten opnieuw checken.
let spelerVervalCheckTimer = null;
function startSpelerVervalCheck(){
  if(spelerVervalCheckTimer) return;
  spelerVervalCheckTimer = setInterval(()=>{
    if(ingelogdSpeler && spelerToernooienAfgelopen(ingelogdSpeler.id)){
      toast('Je bent automatisch uitgelogd — je toernooi is afgelopen.');
      logoutSpeler();
    }
  }, 30*60*1000);
}

async function laadAlles(){
  const [banen, lussen, combinaties, tees, spelers] = await Promise.all([
    sbG('banen','order=naam'),
    sbG('lussen','order=naam'),
    sbG('combinaties','order=naam'),
    sbG('tees','order=kleur'),
    sbG('spelers','select=id,naam,email,exact_hcp,hcp_bevestigd,actief&order=naam')
  ]);
  allBanen = banen||[]; allLussen = lussen||[]; allCombinaties = combinaties||[]; allTees = tees||[]; allSpelers = spelers||[];
  const [toernooien, rondes, deelnemers] = await Promise.all([
    sbG('toernooien','order=created_at.desc'),
    sbG('toernooi_rondes','order=volgorde'),
    sbG('toernooi_deelnemers','')
  ]);
  allToernooien = toernooien||[]; allRondes = rondes||[]; allDeelnemers = deelnemers||[];
  // Los geladen (niet in de Promise.all hierboven): deze tabel bestaat pas nadat de
  // migratie-SQL is uitgevoerd. Zolang dat nog niet zo is, faalt dit zacht (lege lijst)
  // i.p.v. de rest van laadAlles() mee te trekken.
  try{ allExtraPrijzen = await sbG('ronde_extra_prijzen','order=created_at') || []; }
  catch(e){ allExtraPrijzen = []; }
  try{
    const [teams, teamLeden] = await Promise.all([sbG('teams','order=volgorde'), sbG('team_leden','')]);
    allTeams = teams||[]; allTeamLeden = teamLeden||[];
  }catch(e){ allTeams = []; allTeamLeden = []; }
}

/* =========================================================
   LIVE UPDATES (Supabase Realtime)
   Zodra de admin een ronde sluit (of scores wijzigen), ververst het klassement
   en het toernooi-detailscherm vanzelf bij iedereen die de app open heeft staan —
   niemand hoeft meer uit en weer in te loggen om de nieuwe uitslag te zien.
   LET OP: dit werkt alleen als Realtime in Supabase aanstaat voor de tabellen
   'toernooi_rondes' en 'scores' (Database → Replication → tabel aanvinken).
   ========================================================= */
let realtimeChannel = null;
function setupRealtime(){
  if(realtimeChannel) return; // al actief, niet dubbel opzetten
  if(!window.supabase || !window.supabase.createClient) return; // library niet geladen (bv. geen internet bij laden)
  try{
    const client = window.supabase.createClient(SBU, SBK);
    realtimeChannel = client.channel('golftoernooi-live')
      .on('postgres_changes', {event:'*', schema:'public', table:'toernooi_rondes'}, verwerkLiveUpdate)
      .on('postgres_changes', {event:'*', schema:'public', table:'scores'}, verwerkLiveUpdate)
      .subscribe();
  }catch(e){ /* live updates zijn een extra — als dit faalt werkt de rest van de app gewoon door */ }
}
let liveUpdateTimer = null;
function verwerkLiveUpdate(){
  // Debounce: bij het sluiten van een ronde komen kort na elkaar meerdere wijzigingen binnen.
  if(liveUpdateTimer) clearTimeout(liveUpdateTimer);
  liveUpdateTimer = setTimeout(async ()=>{
    try{ allRondes = await sbG('toernooi_rondes','order=volgorde') || allRondes; }catch(e){}
    const klsActief = document.getElementById('panel-klassement')?.classList.contains('active');
    const detailActief = document.getElementById('panel-toernooi-detail')?.classList.contains('active');
    if(klsActief) renderKlassementPanel();
    if(detailActief && huidigToernooiDetailId) openToernooiDetail(huidigToernooiDetailId);
  }, 700);
}

  if(id === '__admin__'){

// Inloggen als admin via hetzelfde ene loginscherm (Naam="Admin" + het
// veld dat dan "Wachtwoord" heet). Er is bewust geen apart naam-veld voor de
// admin: we checken het wachtwoord gewoon tegen alle admin-accounts en loggen
// in als degene die matcht — in de praktijk is er meestal toch maar één.
async function doAdminLoginViaWachtwoordveld(pwd){
  try{
    const rows = await sbG('admins','select=id,naam,pwd_hash') || [];
    let match = null;
    for(const rec of rows){
      if(await verifieerHash(pwd, rec.pwd_hash)){ match = rec; break; }
    }
    if(!match){ toast('Wachtwoord onjuist', true); return; }
    // Je kunt niet tegelijk als speler én als admin ingelogd zijn — inloggen
    // als admin beëindigt automatisch een eventuele actieve spelerssessie.
    const welSpelerActief = !!ingelogdSpeler;
    ingelogdSpeler = null;
    localStorage.removeItem('speler_id');
    ingelogdAdmin = {id: match.id, naam: match.naam};
    localStorage.setItem('admin_naam', match.naam);
    toast(welSpelerActief ? 'Ingelogd als admin — je bent uitgelogd als speler' : 'Ingelogd als admin');
    await boot();
  }catch(e){ toast('Inloggen mislukt: '+e.message, true); }
}

/* =========================================================
   BANEN / LUSSEN / COMBINATIES / TEES
   ========================================================= */
function lusById(id){ return allLussen.find(l=>l.id===id); }
function combinatieById(id){ return allCombinaties.find(c=>c.id===id); }
function baanById(id){ return allBanen.find(b=>b.id===id); }
function teeById(id){ return allTees.find(t=>t.id===id); }

// Geeft de 18 holes (par, si) van een combinatie terug, ongeacht of het 1 lus van
// 18 holes is of 2 lussen van 9 holes samengevoegd (lus1 = holes 1-9, lus2 = 10-18).
function combinatieHoles(comb){
  if(!comb) return null;
  const l1 = lusById(comb.lus1_id);
  if(!l1) return null;
  if(!comb.lus2_id) return l1.holes; // lus is zelf al 18 holes
  const l2 = lusById(comb.lus2_id);
  if(!l2) return null;
  return [...l1.holes, ...l2.holes];
}
function combinatieParTotaal(comb){
  const h = combinatieHoles(comb);
  return h ? h.reduce((a,x)=>a+(x.par||0),0) : null;
}
function combinatieLabel(comb){
  if(!comb) return '—';
  const baan = baanById(comb.baan_id);
  return (baan?baan.naam+' — ':'')+comb.naam;
}

// Welke baankaarten in Banen &amp; lussen opengeklapt staan — apart bijgehouden
// zodat een openstaande kaart open blijft na een re-render (bijv. na het
// opslaan van een tee of lus), in plaats van steeds weer dicht te klappen.
let baanOpenIds = new Set();
function toggleBaanCard(id){
  if(baanOpenIds.has(id)) baanOpenIds.delete(id); else baanOpenIds.add(id);
  renderBanenPanel();
}
function renderBanenPanel(){
  const el = document.getElementById('panel-banen');
  el.innerHTML = `

  </div>
  <div id="banenLijst"></div>`;
  const lijst = document.getElementById('banenLijst');
  if(!allBanen.length){ lijst.innerHTML = '<div class="empty">Nog geen banen toegevoegd.</div>'; return; }
  lijst.innerHTML = allBanen.map(baan=>{
    const lussen = allLussen.filter(l=>l.baan_id===baan.id);
    const combs = allCombinaties.filter(c=>c.baan_id===baan.id);
    // Een lus van 18 holes staat al op zichzelf en krijgt automatisch een eigen
    // combinatie (zie voegTeeToeAanLus) — die twee apart tonen is voor de gebruiker
    // gewoon dezelfde baan twee keer. Toon zo'n lus daarom als ÉÉN kaart mét tees.
    const lussenSolo = lussen.filter(l=>l.holes.length===18);
    const lussenBouwsteen = lussen.filter(l=>l.holes.length!==18);
    const combsMulti = combs.filter(c=>c.lus2_id);
    const open = baanOpenIds.has(baan.id);
    return `

      <div class="ch" style="cursor:pointer${open?'':';border-bottom:none'}" onclick="toggleBaanCard('${baan.id}')">
        <div><div class="ct">${esc(baan.naam)}</div>${baan.locatie?`<div class="rm">${esc(baan.locatie)}</div>`:''}</div>
        <span style="font-size:1.1rem;color:var(--tl);flex-shrink:0">${open?'▴':'▾'}</span>
      </div>
      ${!open?'':`
      <div class="cb">
        <div class="brow" style="margin-bottom:14px">
          <button class="btn bg bsm" onclick="openBaanModal('${baan.id}')">Bewerken</button>
          <button class="btn bd bsm" onclick="verwijderBaan('${baan.id}')">Verwijderen</button>
        </div>
        ${lussenSolo.length? lussenSolo.map(l=>{
          const comb = combinatieVoorLus(l.id);
          const tees = comb ? allTees.filter(t=>t.combinatie_id===comb.id) : [];
          return `<div class="rc"><div class="rch">
            <div><div class="rd" style="font-size:.95rem">${esc(l.naam)}</div><div class="rm">18 holes · par ${l.holes.reduce((a,x)=>a+x.par,0)} · ${tees.length} tee(s)</div></div>
            <div class="brow">
              <button class="btn bp bsm" onclick="voegTeeToeAanLus('${baan.id}','${l.id}')">+ Tee</button>
              <button class="btn bg bsm" onclick="openLusModal('${baan.id}','${l.id}')">Holes bewerken</button>
              <button class="btn bd bsm" onclick="verwijderLus('${l.id}')">×</button>

// Vult de losse par/SI-velden in één keer vanuit geplakte tekst (één "par,si" per regel),
// zodat je een scorekaart niet hole voor hole hoeft over te typen.
function vulHolesVanuitTekst(){
  const raw = document.getElementById('lusSnelInvoer').value.trim();
  if(!raw){ toast('Plak eerst per hole een regel "par,si"', true); return; }
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const n = document.querySelectorAll('#lusHolesWrap .fr').length;
  if(lines.length !== n){
    toast('Je plakte '+lines.length+' regel(s), maar deze lus heeft '+n+' holes — pas "Aantal holes" aan of check je tekst', true);
    return;
  }
  for(let i=0;i<n;i++){
    const parts = lines[i].split(/[,;\t ]+/).map(s=>s.trim()).filter(Boolean);
    const par = parseInt(parts[0]), si = parseInt(parts[1]);
    if(isNaN(par)||isNaN(si)){ toast('Regel '+(i+1)+' ("'+lines[i]+'") snap ik niet — gebruik het formaat par,si', true); return; }
    document.getElementById('lh_par_'+i).value = par;
    document.getElementById('lh_si_'+i).value = si;
  }
  toast('Holes ingevuld — controleer de velden en sla op');
}

/* =========================================================
   SCOREBEREKENING (pure functie — hergebruikt bij invoer én herberekenen)
   ========================================================= */
// holeScores: array van 18 (int of null), holes: array van 18 {par,si}, pH: playing handicap
// Geeft {bruto,netto,stableford,birdies_netto,eagles_netto,birdies_bruto,eagles_bruto,compleet}
function berekenScore(holeScores, holes, pH){
  let bruto=0, sf=0, compleet=true;
  let bN=0, eN=0, bB=0, eB=0;
  for(let i=0;i<18;i++){
    const v = holeScores[i];
    const par = holes[i].par, si = holes[i].si;
    if(v==null || isNaN(v)){ compleet=false; continue; }
    const sh = shots(pH, si);
    const p = sfp(v, par, sh);
    bruto += v; sf += p;
    const netDiff = v - par - sh;   // netto t.o.v. par
    const brutoDiff = v - par;      // bruto t.o.v. par
    if(netDiff===-1) bN++; else if(netDiff<=-2) eN++;
    if(brutoDiff===-1) bB++; else if(brutoDiff<=-2) eB++;
  }
  const netto = compleet ? bruto - pH : null;
  return {bruto:compleet?bruto:null, netto, stableford:compleet?sf:null, birdies_netto:bN, eagles_netto:eN, birdies_bruto:bB, eagles_bruto:eB, compleet};
}

}

const EXTRA_PRIJS_TYPES = ['Neary','Leary','Longest'];

        </div>`).join('') : '<div class="empty">Nog geen extra prijzen toegevoegd voor deze ronde.</div>'}

    <div class="card"><div class="cb">

      <div class="fg" style="margin-top:8px"><label>Type</label><select id="epType">${EXTRA_PRIJS_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('')}</select></div>

      <div class="fg"><label>Categorie</label><select id="epCategorie">${EXTRA_PRIJS_CATEGORIEEN.map(c=>`<option value="${c.v}">${c.l}</option>`).join('')}</select></div>

// Uitslagen op de Klassement-pagina, als eigen subtab "Funnies".
// 'rondes' is dezelfde lijst als de rest van het klassement gebruikt: voor spelers
// alleen gesloten rondes (uitslag wordt pas openbaar zodra de admin de ronde sluit),
// voor admin ook nog-open rondes (zodat je alvast kunt zien wat je hebt ingevoerd).
function renderExtraPrijzenKlassementBody(body, rondes, admin){
  if(!rondes.length){
    body.innerHTML = `<div class="empty">${admin?'Nog geen rondes aangemaakt.':'Nog geen gesloten rondes — de uitslag verschijnt zodra de admin een ronde sluit.'}</div>`;
    return;
  }
  const perRonde = {};
  allExtraPrijzen.forEach(p=>{ if(rondes.some(r=>r.id===p.ronde_id)) (perRonde[p.ronde_id] = perRonde[p.ronde_id]||[]).push(p); });
  const rondesMetPrijzen = rondes.filter(r=>perRonde[r.id] && perRonde[r.id].length);
  if(!rondesMetPrijzen.length){
    body.innerHTML = `<div class="empty">${admin?'Nog geen Neary/Leary/Longest toegevoegd — ga naar Toernooien beheer → een ronde → "Funnies".':'Nog geen extra prijzen bekend voor dit toernooi.'}</div>`;
    return;
  }
  body.innerHTML = rondesMetPrijzen.map(r=>{
    const lijst = perRonde[r.id];
    return `<div style="margin-bottom:18px">
      <div style="font-family:'Inter',sans-serif;font-size:.8rem;font-weight:700;color:var(--tm);margin-bottom:8px">${esc(r.naam)}${r.datum?' · '+fDatum(r.datum):''}</div>

        ${lijst.map(p=>{
          const winnaar = p.winnaar_speler_id ? allSpelers.find(s=>s.id===p.winnaar_speler_id) : null;
          return `<div class="rc" style="padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px">
            <div>
              <div class="rd" style="font-size:.9rem">${esc(p.type)} · hole ${p.hole}</div>
              <div class="rm">${esc(extraPrijsCatLabel(p.categorie))}</div>
            </div>
            <div style="font-family:'Inter',sans-serif;font-size:.9rem;text-align:right;white-space:nowrap">${winnaar?'🏆 <b>'+esc(winnaar.naam)+'</b>':'<span style="color:var(--tl)">nog niet bekend</span>'}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

/* =========================================================
   TEAMS — spelers indelen in teams per toernooi
   'teams' = naam + kleur, per toernooi. 'team_leden' koppelt een speler aan
   een team, met ronde_id = null voor de standaardindeling (geldt voor alle
   rondes) of = een specifieke ronde voor een handmatige uitzondering die
   dáár voorrang heeft (bv. bij een oneven aantal deelnemers). Er is bewust
   geen unique-constraint in de database (Postgres behandelt meerdere NULLs
   in een unique index als verschillend), dus de app zorgt zelf dat er nooit
   twee rijen voor dezelfde (speler, ronde) combinatie bestaan: eerst de
   bestaande rij verwijderen, dan pas de nieuwe toevoegen.
   Teamscore = som van de netto Stableford-punten van de teamleden per
   ronde-label — zie renderTeamsKlassementBody (bij tekenKlassementBody),
   die hergebruikt daarvoor dezelfde per-speler aggregatie als het
   individuele Stableford-klassement.
   ========================================================= */
function teamsVoorToernooi(toernooiId){
  return allTeams.filter(t=>t.toernooi_id===toernooiId).sort((a,b)=>(a.volgorde-b.volgorde)||String(a.created_at).localeCompare(String(b.created_at)));
}
function teamById(id){ return allTeams.find(t=>t.id===id); }
// Geeft het team-id dat voor deze speler geldt in deze ronde terug (of null
// = geen team). Bij een echte ronde (rondeId gezet) telt een eventuele
// ronde-specifieke uitzondering het zwaarst; anders (of als die er niet is)
// geldt de standaardindeling. Bij het opvragen van de kale standaardindeling
// zelf (rondeId = null, bv. in de Teams-beheermodal) wordt de override-check
// overgeslagen — anders zou die zichzelf vinden. De standaardrij wordt
// bovendien alleen gebruikt als het team ook echt bij dít toernooi hoort: een
// speler kan in meerdere toernooien meedoen, en een standaardrij (ronde_id
// null) heeft zelf geen toernooi_id om op te filteren.
function effectiefTeamId(spelerId, rondeId, toernooiId){
  if(rondeId){
    const override = allTeamLeden.find(tl=>tl.speler_id===spelerId && tl.ronde_id===rondeId);
    if(override) return override.team_id || null;
  }
  const standaard = allTeamLeden.find(tl=>tl.speler_id===spelerId && tl.ronde_id==null && teamById(tl.team_id)?.toernooi_id===toernooiId);
  return standaard ? standaard.team_id : null;
}
function openTeamsModal(toernooiId){
  openModalHtml('moTeams', renderTeamsModalHtml(toernooiId));
}

  const teams = teamsVoorToernooi(toernooiId);

    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;max-height:30vh;overflow:auto">
      ${teams.length? teams.map(tm=>`

          <div style="display:flex;align-items:center;gap:8px">
            <span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${tm.kleur};flex-shrink:0"></span>
            <b style="font-size:.9rem">${esc(tm.naam)}</b>
          </div>
          <div class="ra">
            <button class="btn bg bsm" onclick="openTeamBewerkenModal('${tm.id}','${toernooiId}')">Bewerken</button>
            <button class="btn bd bsm" onclick="verwijderTeam('${tm.id}','${toernooiId}')">×</button>
          </div>
        </div>`).join('') : '<div class="empty">Nog geen teams.</div>'}
    </div>
    <div class="card"><div class="cb">
      <b style="font-family:'Inter',sans-serif;font-size:.8rem;color:var(--tm)">Nieuw team</b>
      <div class="fg" style="margin-top:8px"><label>Naam</label><input type="text" id="tmNieuwNaam" placeholder="bv. Team Rood"></div>
      <div class="fg"><label>Kleur</label><input type="color" id="tmNieuwKleur" value="#1a3a2a" style="width:60px;height:34px;padding:2px;cursor:pointer"></div>

    </div></div>
    ${teams.length?`
    <div style="margin:16px 0 6px"><b style="font-family:'Inter',sans-serif;font-size:.8rem;color:var(--tm)">Standaardindeling</b></div>
    <p style="font-size:.72rem;color:var(--tl);font-family:'Inter',sans-serif;margin-bottom:8px">Geldt voor alle rondes van dit toernooi, tenzij je bij een ronde zelf een uitzondering instelt (knop "Teams (ronde)" bij die ronde in Toernooien beheer).</p>
    <div style="display:flex;flex-direction:column;gap:6px;max-height:28vh;overflow:auto">
      ${deeln.length? deeln.map(d=>{
        const sp = allSpelers.find(s=>s.id===d.speler_id);
        const huidig = effectiefTeamId(d.speler_id, null, toernooiId);
        return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <span style="font-size:.86rem">${esc(sp?sp.naam:'?')}</span>
          <select style="max-width:180px" onchange="wijzigStandaardTeam('${d.speler_id}', this.value, '${toernooiId}')">
            <option value="">— geen team —</option>
            ${teams.map(tm=>`<option value="${tm.id}" ${huidig===tm.id?'selected':''}>${esc(tm.naam)}</option>`).join('')}
          </select>
        </div>`;
      }).join('') : '<div class="empty">Nog geen deelnemers.</div>'}
    </div>` : ''}
    <button class="btn bg bf" style="margin-top:14px" onclick="closeModal('moTeams')">Sluiten</button>`;
}
function openTeamBewerkenModal(teamId, toernooiId){
  const tm = teamById(teamId);
  if(!tm) return;
  openModalHtml('moTeamBewerken', `<h3>Team bewerken</h3>
    <div class="fg"><label>Naam</label><input type="text" id="tmEditNaam" value="${esc(tm.naam)}"></div>
    <div class="fg"><label>Kleur</label><input type="color" id="tmEditKleur" value="${tm.kleur}" style="width:60px;height:34px;padding:2px;cursor:pointer"></div>

}
async function saveTeam(id, toernooiId){
  const naam = document.getElementById(id?'tmEditNaam':'tmNieuwNaam').value.trim();
  const kleur = document.getElementById(id?'tmEditKleur':'tmNieuwKleur').value;
  if(!naam){ toast('Vul een naam in', true); return; }
  try{
    if(id){
      await sbPa('teams', id, {naam, kleur});
      const tm = allTeams.find(x=>x.id===id); if(tm){ tm.naam=naam; tm.kleur=kleur; }
      toast('Team opgeslagen');
      closeModal('moTeamBewerken');
    } else {
      const volgorde = teamsVoorToernooi(toernooiId).length+1;
      const nieuw = await sbP('teams', {toernooi_id:toernooiId, naam, kleur, volgorde});
      if(nieuw && nieuw[0]) allTeams.push(nieuw[0]);
      toast('Team toegevoegd');
    }
    openModalHtml('moTeams', renderTeamsModalHtml(toernooiId));
    renderBeheerToernooienPanel();
  }catch(e){ toast('Opslaan mislukt: '+e.message, true); }
}
async function verwijderTeam(id, toernooiId){
  if(!confirm('Dit team verwijderen? De teamindeling voor dit team (standaard en per-ronde uitzonderingen) wordt ook verwijderd.')) return;
  try{
    await sbD('teams', id);
    allTeams = allTeams.filter(t=>t.id!==id);
    allTeamLeden = allTeamLeden.filter(tl=>tl.team_id!==id);
    toast('Team verwijderd');
    openModalHtml('moTeams', renderTeamsModalHtml(toernooiId));
    renderBeheerToernooienPanel();
  }catch(e){ toast('Verwijderen mislukt: '+e.message, true); }
}
// Wijzigt de standaardindeling (ronde_id = null) van één speler. Er mag maar
// één standaardrij per speler per toernooi bestaan, dus eerst een eventuele
// bestaande verwijderen (toernooi-gescoped, zie effectiefTeamId), dan pas
// de nieuwe toevoegen.
async function wijzigStandaardTeam(spelerId, teamId, toernooiId){
  try{
    const bestaand = allTeamLeden.find(tl=>tl.speler_id===spelerId && tl.ronde_id==null && teamById(tl.team_id)?.toernooi_id===toernooiId);
    if(bestaand){
      await sbD('team_leden', bestaand.id);
      allTeamLeden = allTeamLeden.filter(tl=>tl.id!==bestaand.id);
    }
    if(teamId){
      const nieuw = await sbP('team_leden', {team_id:teamId, speler_id:spelerId, ronde_id:null});
      if(nieuw && nieuw[0]) allTeamLeden.push(nieuw[0]);
    }
    toast('Team opgeslagen');
  }catch(e){ toast('Opslaan mislukt: '+e.message, true); }
}
function openTeamRondeModal(rondeId){
  openModalHtml('moTeamRonde', renderTeamRondeModalHtml(rondeId));
}
function renderTeamRondeModalHtml(rondeId){
  const ronde = rondeById(rondeId);
  const toernooiId = ronde.toernooi_id;
  const teams = teamsVoorToernooi(toernooiId);
  const deeln = allDeelnemers.filter(d=>d.toernooi_id===toernooiId);
  return `<h3>Teams voor deze ronde</h3>
    <p style="font-size:.78rem;color:var(--tl);font-family:'Inter',sans-serif;margin-bottom:10px">${esc(ronde.naam)} — handmatige uitzondering op de standaardindeling, geldt alleen voor deze ronde.</p>
    <div style="display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow:auto">
      ${deeln.length? deeln.map(d=>{
        const sp = allSpelers.find(s=>s.id===d.speler_id);
        const override = allTeamLeden.find(tl=>tl.speler_id===d.speler_id && tl.ronde_id===rondeId);
        const huidigeWaarde = override ? (override.team_id||'') : '__default__';
        const standaardTeamId = effectiefTeamId(d.speler_id, null, toernooiId);
        const standaardTeam = standaardTeamId ? teamById(standaardTeamId) : null;
        return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <span style="font-size:.86rem">${esc(sp?sp.naam:'?')}</span>
          <select style="max-width:220px" onchange="wijzigTeamVoorRonde('${d.speler_id}','${rondeId}', this.value)">
            <option value="__default__" ${huidigeWaarde==='__default__'?'selected':''}>— standaard (${standaardTeam?esc(standaardTeam.naam):'geen team'}) —</option>
            <option value="" ${huidigeWaarde===''?'selected':''}>— geen team (uitzondering) —</option>
            ${teams.map(tm=>`<option value="${tm.id}" ${huidigeWaarde===tm.id?'selected':''}>${esc(tm.naam)}</option>`).join('')}
          </select>
        </div>`;
      }).join('') : '<div class="empty">Nog geen deelnemers.</div>'}
    </div>
    <button class="btn bg bf" style="margin-top:14px" onclick="closeModal('moTeamRonde')">Sluiten</button>`;
}
// waarde: team-id → koppel aan dat team voor déze ronde; '' → expliciet geen
// team (uitzondering, telt zwaarder dan de standaardindeling); '__default__'
// → verwijder de uitzondering weer, zodat de standaardindeling weer geldt.
async function wijzigTeamVoorRonde(spelerId, rondeId, waarde){
  try{
    const bestaand = allTeamLeden.find(tl=>tl.speler_id===spelerId && tl.ronde_id===rondeId);
    if(bestaand){
      await sbD('team_leden', bestaand.id);
      allTeamLeden = allTeamLeden.filter(tl=>tl.id!==bestaand.id);
    }
    if(waarde !== '__default__'){
      const nieuw = await sbP('team_leden', {team_id: waarde||null, speler_id:spelerId, ronde_id:rondeId});
      if(nieuw && nieuw[0]) allTeamLeden.push(nieuw[0]);
    }
    toast('Opgeslagen');
  }catch(e){ toast('Opslaan mislukt: '+e.message, true); }
}

function resizeLogoBestand(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 400;
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>=h){ h = Math.round(h*maxDim/w); w = maxDim; } else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = ()=>reject(new Error('Kon afbeelding niet lezen'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('Kon bestand niet lezen'));
    reader.readAsDataURL(file);
  });
}

// Rekent alle opgeslagen scores van een ronde opnieuw door met de actuele
// tee-, handicap- en hole-gegevens, en overschrijft afwijkende waarden.
// Voorkomt dat een kaart een verouderd (stale) stableford-totaal blijft tonen
// nadat er ná het invoeren nog iets aan tees, holes of handicaps is gecorrigeerd.
// Wordt aangeroepen bij het sluiten van een ronde — ook als die ronde eerder
// al eens gesloten en weer heropend is, dus elke sluiting rekent opnieuw na.
async function herberekenRondeScores(rondeId){
  const ronde = rondeById(rondeId);
  if(!ronde) return 0;
  const comb = combinatieById(ronde.combinatie_id);
  const holes = combinatieHoles(comb);
  const toernooi = allToernooien.find(t=>t.id===ronde.toernooi_id);
  if(!holes || !toernooi) return 0;
  let scores = [];
  try{ scores = await sbG('scores','ronde_id=eq.'+rondeId) || []; }
  catch(e){ toast('Kon scores niet laden voor herberekening: '+e.message, true); return 0; }
  let aangepast = 0;
  for(const score of scores){
    if(!score.tee_id || !score.hole_scores) continue;
    const tee = teeById(score.tee_id);
    const speler = allSpelers.find(s=>s.id===score.speler_id);
    if(!tee || !speler) continue;
    const freshPH = playingHandicap(speler.exact_hcp, tee, toernooi.allowance_pct);
    const uitkomst = berekenScore(score.hole_scores, holes, freshPH);
    const gewijzigd = score.playing_hcp!==freshPH || score.stableford!==uitkomst.stableford ||
      score.bruto!==uitkomst.bruto || score.netto!==uitkomst.netto ||
      score.birdies_netto!==uitkomst.birdies_netto || score.eagles_netto!==uitkomst.eagles_netto ||
      score.birdies_bruto!==uitkomst.birdies_bruto || score.eagles_bruto!==uitkomst.eagles_bruto;
    if(!gewijzigd) continue;
    try{
      await sbPa('scores', score.id, {
        playing_hcp: freshPH, bruto: uitkomst.bruto, netto: uitkomst.netto, stableford: uitkomst.stableford,
        birdies_netto: uitkomst.birdies_netto, eagles_netto: uitkomst.eagles_netto,
        birdies_bruto: uitkomst.birdies_bruto, eagles_bruto: uitkomst.eagles_bruto
      });
      aangepast++;
    }catch(e){ toast('Herberekenen mislukt voor één kaart: '+e.message, true); }
  }
  return aangepast;
}
async function sluitRonde(id){
  if(!confirm('Ronde sluiten? Alle kaarten worden eerst opnieuw doorgerekend met de actuele tee- en handicapgegevens. Deelnemers zien dan de uitslag. Zorg dat alle kaarten zijn ingevoerd.')) return;

  const m = regel.match(/^(.*)\(([^)]*)\)\s*$/);

  return {naam: regel.trim(), notitie: null};

    <div id="stlLijst"></div>
    <div class="brow" style="margin-top:12px;gap:8px" id="stlActies"></div>
    <div class="card" style="margin-top:20px"><div class="cb">
      <div class="fg" style="margin-bottom:0">
        <label>Of: startlijst plakken <span class="hint">per flight: eerste regel de starttijd (optioneel gevolgd door de starthole, bv. "13:40 hole 3"), daarna één naam per regel; flights gescheiden door een lege regel</span></label>
        <textarea id="stlPlak" rows="7" placeholder="13:40 hole 1
Naam 1
Naam 2 (B)
Naam 3 (B)

13:50 hole 10
Naam 4
Naam 5
Naam 6"></textarea>
        <button class="btn bp bsm" style="margin-top:6px" onclick="importeerStartlijst()" type="button">Importeren</button>
        <p style="font-size:.72rem;color:var(--tl);font-family:'Inter',sans-serif;margin-top:6px">Namen die nog geen account hebben worden automatisch aangemaakt (met een willekeurige pincode, die je na het importeren te zien krijgt) en meteen als deelnemer aan dit toernooi gekoppeld.</p>
      </div>

  `;
  renderStartlijstLijst();

}

/* ---------- Startlijst opstellen: handmatig indelen + automatisch voorstellen ---------- */
// Deelnemers van dit toernooi die nog in GEEN enkele flight van déze ronde zitten
// (dus nog niet via plakken/eerder opslaan zijn ingedeeld) — dit is de pool
// waaruit handmatig en automatisch ingedeeld kan worden. Tijdens het aanpassen
// van een al opgeslagen startlijst (_stlBewerken) tellen de eigen, al
// opgeslagen flights niet mee als "al geplaatst" — dat zijn precies de
// spelers die je nu aan het herindelen bent.
function stlBeschikbareDeelnemers(rondeId){
  const ronde = rondeById(rondeId);
  const ctx = window._stlCtx;
  const alGeplaatst = window._stlBewerken ? new Set() : new Set((ctx?.fSpelers||[]).map(fs=>fs.speler_id));
  const deeln = allDeelnemers.filter(d=>d.toernooi_id===ronde.toernooi_id && d.status!=='afgemeld' && !alGeplaatst.has(d.speler_id));
  return deeln.map(d=>allSpelers.find(s=>s.id===d.speler_id)).filter(Boolean).sort((a,b)=>a.naam.localeCompare(b.naam));
}
function initStlVoorstel(){
  window._stlVoorstel = {flightCount:1, flightSize:4, toewijzing:{}, flights:{}};
  window._stlBewerken = false;
}
// Telt, over alle ANDERE rondes van dit toernooi, hoe vaak elk spelerspaar al
// samen in een flight zat — gebruikt door "Nog niet samen gespeeld".
function stlPaarTeller(){
  const ctx = window._stlCtx;
  const {flights, spelers} = ctx.toernooiFlights || {flights:[], spelers:[]};
  const relevantFlightIds = new Set(flights.filter(f=>f.ronde_id!==ctx.rondeId).map(f=>f.id));
  const perFlight = {};
  spelers.forEach(fs=>{
    if(!relevantFlightIds.has(fs.flight_id)) return;
    (perFlight[fs.flight_id] = perFlight[fs.flight_id]||[]).push(fs.speler_id);
  });
  const teller = {};
  Object.values(perFlight).forEach(leden=>{
    for(let i=0;i<leden.length;i++) for(let j=i+1;j<leden.length;j++){
      const k1 = leden[i]+'|'+leden[j], k2 = leden[j]+'|'+leden[i];
      teller[k1] = (teller[k1]||0)+1; teller[k2] = (teller[k2]||0)+1;
    }
  });
  return teller;
}
// Huidige stand (totaal netto Stableford, zelfde telling als het Klassement-
// tabblad "Stableford") per speler, over alle GESLOTEN rondes van dit
// toernooi — gebruikt door "Op stand klassement" om te seeden.
async function stlKlassementStanden(toernooiId){
  const rondes = allRondes.filter(r=>r.toernooi_id===toernooiId && r.status==='gesloten');
  const standen = {};
  if(!rondes.length) return standen;
  const scores = await laadScoresVoorToernooi(toernooiId);
  const rondeMap = {}; rondes.forEach(r=>rondeMap[r.id]=r);
  const holesCache = {};
  function holesVoorRonde(r){ if(!(r.id in holesCache)) holesCache[r.id]=combinatieHoles(combinatieById(r.combinatie_id)); return holesCache[r.id]; }
  scores.forEach(s=>{
    const r = rondeMap[s.ronde_id];
    if(!r || s.stableford==null) return;
    const eff = effectieveStablefordVoorRonde(s, r, holesVoorRonde(r));
    standen[s.speler_id] = (standen[s.speler_id]||0) + eff;
  });
  return standen;
}
function stlShuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
// Rekent de starttijd van flight nr. (0-based index) uit op basis van de
// eerste starttijd + interval (min) — leeg als er geen geldige eerste
// starttijd (HH:MM) is ingevuld.
function stlBerekenTijd(eersteTijd, interval, index){
  const m = (eersteTijd||'').trim().match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return '';
  let mins = parseInt(m[1],10)*60 + parseInt(m[2],10) + interval*index;
  const hh = Math.floor(mins/60)%24, mm = mins%60;
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}
// Spelers/flight heeft altijd een waarde (dropdown), dus dit checkt in de
// praktijk of starttijd en hole zijn ingevuld — pas dan mogen de
// genereer-knoppen daadwerkelijk iets doen.
function stlKanGenereren(){
  const spelers = (document.getElementById('stlFlightSize')||{}).value;
  const tijd = ((document.getElementById('stlEersteTijd')||{}).value||'').trim();
  const hole = ((document.getElementById('stlHole')||{}).value||'').trim();
  return !!spelers && !!tijd && !!hole;
}
function stlUpdateGenKnopStatus(){
  const wrap = document.getElementById('stlGenKnoppen');
  const hint = document.getElementById('stlGenHint');
  if(!wrap) return;
  const ok = stlKanGenereren();
  wrap.classList.toggle('stl-locked', !ok);
  if(hint) hint.textContent = ok ? '' : 'Vul eerst spelers, starttijd en hole in om een indeling te kunnen genereren.';
}
// Wisselt de sorteerrichting (laag→hoog / hoog→laag) van één van de drie
// hcp/klassement-knoppen — dit is een sub-optie van díe knop, dus zit vast
// aan het knopje zelf in plaats van een los bedieningselement.
function stlWisselVolgorde(el){
  const nieuw = el.getAttribute('data-dir')==='asc' ? 'desc' : 'asc';
  el.setAttribute('data-dir', nieuw);
  el.textContent = nieuw==='asc' ? '↑' : '↓';
  el.title = (nieuw==='asc'?'Laag → hoog':'Hoog → laag')+' — klik om te wisselen';
}
function stlLeesRichting(methode){
  const el = document.getElementById('stlDir_'+methode);
  return (el && el.getAttribute('data-dir')==='desc') ? -1 : 1;
}
// Verdeelt de volledige pool oningedeelde deelnemers opnieuw volgens de
// gekozen methode en vervangt daarmee het hele voorstel (bestaande handmatige
// toewijzingen in dit voorstel worden dus opnieuw ingedeeld — er wordt nog
// niets opgeslagen, dus dat is altijd veilig terug te draaien vóór opslaan).
async function stlGenereer(methode){
  if(!stlKanGenereren()){ toast('Vul eerst spelers, starttijd en hole in', true); return; }
  const ctx = window._stlCtx;
  const ronde = rondeById(ctx.rondeId);
  const v = window._stlVoorstel;
  const flightSize = Math.max(2, parseInt(document.getElementById('stlFlightSize').value,10)||4);
  v.flightSize = flightSize;
  const eersteTijd = (document.getElementById('stlEersteTijd').value||'').trim();
  const hole = (document.getElementById('stlHole').value||'').trim();
  const interval = Math.max(1, parseInt(document.getElementById('stlInterval').value,10)||10);
  const richting = stlLeesRichting(methode);
  const beschikbaar = stlBeschikbareDeelnemers(ctx.rondeId);
  if(!beschikbaar.length){ toast('Geen oningedeelde deelnemers om te verdelen', true); return; }

  let groepen = [];
  if(methode==='willekeurig'){
    const geschud = stlShuffle(beschikbaar);
    for(let i=0;i<geschud.length;i+=flightSize) groepen.push(geschud.slice(i,i+flightSize));
  } else if(methode==='hcp_individueel'){
    // Spelers van vergelijkbaar niveau bij elkaar: gesorteerd op hcp (richting
    // bepaalt laag-hoog of hoog-laag), dan in opeenvolgende blokjes van
    // flightSize verdeeld.
    const gesorteerd = beschikbaar.slice().sort((a,b)=>richting*((a.exact_hcp??36)-(b.exact_hcp??36)));
    for(let i=0;i<gesorteerd.length;i+=flightSize) groepen.push(gesorteerd.slice(i,i+flightSize));
  } else if(methode==='hcp_flight'){
    // Elke flight een vergelijkbaar totaal/gemiddeld hcp: slang-verdeling
    // (1,2,3,4,4,3,2,1,...) over het gekozen aantal flights.
    const gesorteerd = beschikbaar.slice().sort((a,b)=>richting*((a.exact_hcp??36)-(b.exact_hcp??36)));
    const aantalFlights = Math.max(1, Math.ceil(gesorteerd.length/flightSize));
    groepen = Array.from({length:aantalFlights}, ()=>[]);
    let idx=0, slang=1;
    gesorteerd.forEach(sp=>{
      groepen[idx].push(sp);
      if(idx+slang<0 || idx+slang>=aantalFlights) slang*=-1; else idx+=slang;
    });
  } else if(methode==='nieuwe_combinaties'){
    // Greedy: bouw elke flight op door telkens de kandidaat toe te voegen die
    // met de huidige flightleden de minste eerdere gezamenlijke rondes heeft.
    const paarTeller = stlPaarTeller();
    const over = stlShuffle(beschikbaar);
    while(over.length){
      const groep = [over.shift()];
      while(groep.length<flightSize && over.length){
        let besteIdx=0, besteScore=Infinity;
        over.forEach((kandidaat,i)=>{
          const score = groep.reduce((sum,lid)=>sum+(paarTeller[lid.id+'|'+kandidaat.id]||0),0);
          if(score<besteScore){ besteScore=score; besteIdx=i; }
        });
        groep.push(over.splice(besteIdx,1)[0]);
      }
      groepen.push(groep);
    }
  } else if(methode==='klassement'){
    // Huidige stand seeden: richting bepaalt of de laagst geklasseerden (of
    // nog geen score) in de eerste flight komen, of juist de koplopers.
    const standen = await stlKlassementStanden(ronde.toernooi_id);
    const gesorteerd = beschikbaar.slice().sort((a,b)=>richting*((standen[a.id]??-Infinity)-(standen[b.id]??-Infinity)));
    for(let i=0;i<gesorteerd.length;i+=flightSize) groepen.push(gesorteerd.slice(i,i+flightSize));
    if(!Object.keys(standen).length) toast('Nog geen gesloten ronde met scores — iedereen is gelijk behandeld');
  } else return;

  v.toewijzing = {};
  v.flights = {};
  groepen.forEach((groep,i)=>{
    const nr = i+1;
    groep.forEach(sp=>{ v.toewijzing[sp.id]=nr; });
    v.flights[nr] = {};
    const tijd = stlBerekenTijd(eersteTijd, interval, i);
    if(tijd) v.flights[nr].tijd = tijd;
    if(hole) v.flights[nr].hole = hole;
  });
  v.flightCount = Math.max(groepen.length, 1);
  renderStartlijstLijst();
  toast(groepen.length+' flight(s) voorgesteld — controleer en pas zo nodig aan vóór opslaan');
}
function stlResetVoorstel(){
  initStlVoorstel();
  renderStartlijstLijst();
  toast('Voorstel gewist');
}
async function stlOpslaanVoorstel(){
  const ctx = window._stlCtx;
  const v = window._stlVoorstel;
  const gebruikteNrs = Array.from(new Set(Object.values(v.toewijzing)));
  if(!gebruikteNrs.length){ toast('Nog geen spelers toegewezen aan een flight', true); return; }
  const zonderTijd = gebruikteNrs.filter(nr=>!((v.flights[nr]||{}).tijd||'').trim());
  if(zonderTijd.length && !confirm(zonderTijd.length+' van de '+gebruikteNrs.length+' flight(s) heeft nog geen starttijd ingevuld. Zonder starttijd zien deelnemers deze bij het inloggen niet. Toch opslaan?')) return;
  // Bij het aanpassen van een al opgeslagen startlijst vervangt het concept de
  // oude flights helemaal — dus eerst de oude flights weg, dan de (evt.
  // bewerkte) indeling opnieuw opslaan, in plaats van ernaast toe te voegen.
  const bewerken = !!(window._stlBewerken && ctx.flights.length);
  try{
    if(bewerken){
      for(const f of ctx.flights){ await sbD('ronde_flights', f.id); }
    }
    let volgordeFlight = bewerken ? 1 : (ctx.flights.reduce((m,f)=>Math.max(m,f.volgorde),0) + 1);
    for(const nr of gebruikteNrs){
      const leden = Object.keys(v.toewijzing).filter(sid=>v.toewijzing[sid]===nr)
        .map(sid=>allSpelers.find(s=>s.id===sid)).filter(Boolean)
        .sort((a,b)=>a.naam.localeCompare(b.naam));
      if(!leden.length) continue;
      const f = v.flights[nr]||{};
      const flightRows = await sbP('ronde_flights', {ronde_id: ctx.rondeId, starttijd: f.tijd||null, start_hole: f.hole?parseInt(f.hole,10):null, volgorde: volgordeFlight});
      const flight = flightRows[0];
      volgordeFlight++;
      const rijen = leden.map((sp,i)=>({flight_id:flight.id, speler_id:sp.id, volgorde:i+1}));
      await sbP('ronde_flight_spelers', rijen);
    }
    await laadAlles();
    await renderStartlijstBody(ctx.rondeId);
    renderBeheerToernooienPanel();
    toast(bewerken ? 'Startlijst bijgewerkt' : gebruikteNrs.length+' flight(s) opgeslagen');
  }catch(e){ toast('Mislukt: '+e.message, true); }
}
function renderStartlijstLijst(){
  const ctx = window._stlCtx;
  const el = document.getElementById('stlLijst');
  const v = window._stlVoorstel || {toewijzing:{}, flights:{}};
  const conceptNrs = Array.from(new Set(Object.values(v.toewijzing))).sort((a,b)=>a-b);
  const bewerken = !!window._stlBewerken;
  const toonOpgeslagenLijst = ctx.flights.length>0 && !bewerken;

  stlWeergaveGenerator(ctx, conceptNrs, bewerken);
  stlRenderActies(ctx, bewerken);

  if(!toonOpgeslagenLijst && !conceptNrs.length){
    el.innerHTML = '<div class="empty">Nog geen flights opgeslagen voor deze ronde.</div>';
    return;
  }

  let html = '';
  if(toonOpgeslagenLijst){
    html += `
      <div style="display:flex;flex-direction:column;gap:6px">
      ${ctx.flights.map(f=>{
        const spelers = ctx.fSpelers.filter(fs=>fs.flight_id===f.id).sort((a,b)=>a.volgorde-b.volgorde);
        return `<div class="rc"><div class="rch">
          <div style="flex:1">
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:3px">
              <input type="text" value="${esc(f.starttijd||'')}" placeholder="tijd (13:40)" style="width:90px" onchange="wijzigFlightVeld('${f.id}','starttijd',this.value)">
              <input type="number" value="${f.start_hole||''}" placeholder="hole" style="width:64px" onchange="wijzigFlightVeld('${f.id}','start_hole',this.value)">
              ${!f.starttijd?'<span class="hint" style="color:var(--red)">geen starttijd — verschijnt dan niet bij het inloggen</span>':''}
            </div>
            <div class="rm">${spelers.map(fs=>{
              const sp = allSpelers.find(s=>s.id===fs.speler_id);
              return esc(sp?sp.naam:'?') + (fs.notitie?' <span class="hint">('+esc(fs.notitie)+')</span>':'');
            }).join(', ')||'—'}</div>
          </div>
          <button class="btn bd bsm" onclick="verwijderFlight('${f.id}')">×</button>
        </div></div>`;
      }).join('')}
      </div>
    `;
  }

  if(conceptNrs.length){
    const nietIngedeeld = stlBeschikbareDeelnemers(ctx.rondeId).filter(sp=>!(sp.id in v.toewijzing));
    html += `
      <div style="margin-top:${toonOpgeslagenLijst?'16px':'0'}">
        <div style="font-size:.72rem;color:var(--tl);font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">Concept <span class="hint" style="text-transform:none;letter-spacing:0">sleep spelers tussen flights, of klik × om te verwijderen</span></div>
        <div style="display:flex;flex-direction:column;gap:6px">
        ${conceptNrs.map(nr=>{
          const leden = Object.keys(v.toewijzing).filter(sid=>v.toewijzing[sid]===nr)
            .map(sid=>allSpelers.find(s=>s.id===sid)).filter(Boolean)
            .sort((a,b)=>a.naam.localeCompare(b.naam));
          const f = v.flights[nr]||{};
          return `<div class="rc" style="border-style:dashed" ondragover="event.preventDefault()" ondrop="stlDropOpFlight(event,${nr})"><div class="rch">
            <div style="flex:1">
              <div class="rd" style="font-size:.9rem">${f.tijd?esc(f.tijd):'nog geen starttijd'}${f.hole?' · hole '+esc(f.hole):''}</div>
              <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;min-height:30px">
                ${leden.length ? leden.map(sp=>stlSpelerChipHtml(sp)).join('') : '<span class="hint">sleep hier spelers naartoe</span>'}
              </div>
            </div>
          </div></div>`;
        }).join('')}
        </div>
        ${nietIngedeeld.length ? `
        <div style="margin-top:10px" ondragover="event.preventDefault()" ondrop="stlDropInPool(event)">
          <div class="hint" style="margin-bottom:4px">Nog niet ingedeeld — sleep naar een flight hierboven</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1.5px dashed var(--cd);border-radius:var(--r)">
            ${nietIngedeeld.map(sp=>stlSpelerChipHtml(sp)).join('')}
          </div>
        </div>` : ''}
      </div>
    `;
  }

  el.innerHTML = html;
}
// Toont/verbergt de spelers/starttijd/hole/interval-velden + indeel-knoppen:
// die zijn alleen relevant als er nog geen startlijst is opgeslagen, of
// tijdens het aanpassen van een al opgeslagen startlijst.
function stlWeergaveGenerator(ctx, conceptNrs, bewerken){
  const el = document.getElementById('stlGenSectie');
  if(!el) return;
  const toon = !ctx.flights.length || bewerken || conceptNrs.length>0;
  el.style.display = toon ? '' : 'none';
}
// De actieknoppen onder de lijst wisselen van betekenis: bij een al
// opgeslagen startlijst (en niet aan het aanpassen) staat er "aanpassen" +
// "wissen"; anders (nieuw opbouwen, of tijdens het aanpassen) "opslaan" +
// "voorstel wissen".
function stlRenderActies(ctx, bewerken){
  const el = document.getElementById('stlActies');
  if(!el) return;
  if(ctx.flights.length>0 && !bewerken){
    el.innerHTML = `
      <button class="btn bp" style="flex:1" type="button" onclick="stlStartAanpassen()">Startlijst aanpassen</button>
      <button class="btn bd" style="flex:1" type="button" onclick="wisAlleFlights()">Startlijst wissen</button>
    `;
  } else {
    el.innerHTML = `
      <button class="btn bp" style="flex:1" type="button" onclick="stlOpslaanVoorstel()">Startlijst opslaan</button>
      <button class="btn bd" style="flex:1" type="button" onclick="stlResetVoorstel()">Voorstel wissen</button>
    `;
  }
}
// Zet de al opgeslagen startlijst om in een bewerkbaar concept (met de
// sleepbare speler-veldjes), zodat je 'm kunt aanpassen vóór opnieuw opslaan.
function stlStartAanpassen(){
  const ctx = window._stlCtx;
  const v = window._stlVoorstel;
  v.toewijzing = {};
  v.flights = {};
  const nrByFlightId = {};
  const sortedFlights = ctx.flights.slice().sort((a,b)=>a.volgorde-b.volgorde);
  sortedFlights.forEach((f,i)=>{
    const nr = i+1;
    nrByFlightId[f.id] = nr;
    v.flights[nr] = {};
    if(f.starttijd) v.flights[nr].tijd = f.starttijd;
    if(f.start_hole) v.flights[nr].hole = String(f.start_hole);
  });
  ctx.fSpelers.forEach(fs=>{
    const nr = nrByFlightId[fs.flight_id];
    if(nr) v.toewijzing[fs.speler_id] = nr;
  });
  v.flightCount = Math.max(sortedFlights.length, 1);
  window._stlBewerken = true;
  const eerste = sortedFlights[0];
  if(eerste){
    const tijdEl = document.getElementById('stlEersteTijd');
    const holeEl = document.getElementById('stlHole');
    if(tijdEl && eerste.starttijd) tijdEl.value = eerste.starttijd;
    if(holeEl && eerste.start_hole) holeEl.value = eerste.start_hole;
  }
  renderStartlijstLijst();
  stlUpdateGenKnopStatus();
}
// Eén speler-"chipje" in de concept-indeling: sleepbaar tussen flights, met
// een rood kruisje om 'm uit de indeling te halen (komt dan in de
// "nog niet ingedeeld"-pool onder de flights te staan).
function stlSpelerChipHtml(sp){
  return `<span draggable="true" ondragstart="stlDragStart(event,'${sp.id}')" style="display:inline-flex;align-items:center;gap:5px;background:var(--cd);border-radius:20px;padding:4px 6px 4px 10px;font-size:.82rem;font-family:'Inter',sans-serif;cursor:grab;user-select:none">${esc(sp.naam)}<span onclick="stlVerwijderUitConcept('${sp.id}')" title="Verwijderen uit indeling" style="cursor:pointer;color:var(--red);font-weight:700;line-height:1;padding:1px 3px">×</span></span>`;
}
function stlDragStart(ev, spelerId){
  ev.dataTransfer.setData('text/plain', spelerId);
  ev.dataTransfer.effectAllowed = 'move';
}
function stlDropOpFlight(ev, nr){
  ev.preventDefault();
  const spelerId = ev.dataTransfer.getData('text/plain');
  if(!spelerId) return;
  window._stlVoorstel.toewijzing[spelerId] = nr;
  renderStartlijstLijst();
}
function stlDropInPool(ev){
  ev.preventDefault();

async function importeerStartlijst(){
  const ctx = window._stlCtx;
  const raw = document.getElementById('stlPlak').value.trim();
  if(!raw){ toast('Plak eerst een startlijst', true); return; }
  const ronde = rondeById(ctx.rondeId);
  const blocks = raw.split(/\n\s*\n/).map(b=>b.split('\n').map(l=>l.trim()).filter(Boolean)).filter(b=>b.length>1);
  if(!blocks.length){ toast('Kon geen flights herkennen — eerste regel is de tijd, daarna namen', true); return; }

  const nieuweSpelers = [];
  let gekoppeldeSpelers = 0;
  let volgordeFlight = ctx.flights.reduce((m,f)=>Math.max(m,f.volgorde),0) + 1;

  for(const block of blocks){
    // Eerste regel is de starttijd, optioneel gevolgd door de starthole
    // (bv. "13:40 hole 3" of "13:40 tee 3"). Zonder dat woord blijft de
    // hele regel gewoon de starttijd, zoals voorheen.
    const holeMatch = block[0].match(/^(.*?)\s+(?:hole|holl|tee)\.?\s*#?\s*(\d{1,2})\s*$/i);
    const starttijd = holeMatch ? holeMatch[1].trim() : block[0];
    const start_hole = holeMatch ? parseInt(holeMatch[2],10) : null;
    const namen = block.slice(1);
    try{
      const flightRows = await sbP('ronde_flights', {ronde_id: ctx.rondeId, starttijd, start_hole, volgorde: volgordeFlight});
      const flight = flightRows[0];
      volgordeFlight++;
      let volgordeSpeler = 1;
      for(const regel of namen){
        const {naam, notitie} = parseNaamRegel(regel);
        if(!naam) continue;
        let speler = allSpelers.find(s=>s.naam.toLowerCase()===naam.toLowerCase());
        if(!speler){
          const pin = genereerRandomPin();
          const hash = await maakHash(pin);
          const rows = await sbP('spelers', {naam, pin_hash:hash});
          speler = rows[0];
          allSpelers.push(speler);
          nieuweSpelers.push({naam, pin});
        } else {
          gekoppeldeSpelers++;
        }
        const bestaandeDeelname = allDeelnemers.find(d=>d.toernooi_id===ronde.toernooi_id && d.speler_id===speler.id);
        if(!bestaandeDeelname){
          const dRows = await sbP('toernooi_deelnemers', {toernooi_id: ronde.toernooi_id, speler_id: speler.id, status:'bevestigd'});
          allDeelnemers.push(dRows[0]);
        }
        await sbP('ronde_flight_spelers', {flight_id: flight.id, speler_id: speler.id, notitie, volgorde: volgordeSpeler});
        volgordeSpeler++;
      }
    }catch(e){ toast('Fout bij importeren: '+e.message, true); }
  }

  document.getElementById('stlPlak').value = '';
  await laadAlles();
  await renderStartlijstBody(ctx.rondeId);
  renderBeheerToernooienPanel();
  toast(blocks.length+' flight(s) verwerkt · '+gekoppeldeSpelers+' bestaande speler(s) gekoppeld · '+nieuweSpelers.length+' nieuwe account(s)');

  if(nieuweSpelers.length){
    openModalHtml('moNieuwePincodes', `<h3>${nieuweSpelers.length} nieuwe spelersaccounts</h3>
      <p style="font-size:.82rem;color:var(--tl);font-family:'Inter',sans-serif;margin-bottom:10px">Deel deze pincodes met de betreffende spelers zodat ze kunnen inloggen (ze kunnen 'm daarna zelf wijzigen via Profiel).</p>
      <div class="tw"><table><thead><tr><th>Naam</th><th>Pincode</th></tr></thead><tbody>
      ${nieuweSpelers.map(n=>`<tr><td>${esc(n.naam)}</td><td><b>${n.pin}</b></td></tr>`).join('')}
      </tbody></table></div>
      <button class="btn bp bf" style="margin-top:12px" onclick="closeModal('moNieuwePincodes')">Sluiten</button>`);
  }
}
