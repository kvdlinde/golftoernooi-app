name: Test


on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/syntax-check.js
      - run: node tests/score-grid.test.js
      - run: node tests/admin-race.test.jsc: 1
      d: 2
      
